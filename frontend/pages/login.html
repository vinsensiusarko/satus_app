<!-- frontend/pages/login.html -->
<template id="tpl-login">
  <div class="flex-grow flex items-center justify-center py-10 px-4">
    <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-xl shadow-slate-200/60 w-full max-w-md border border-slate-100 animate-scale-in">
      
      <!-- Brand Header -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-gradient-to-br from-green-500 via-emerald-600 to-teal-700 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-green-500/20 border border-green-400/30 text-white">
          <i data-lucide="leaf" class="w-8 h-8 text-yellow-300"></i>
        </div>
        <div class="flex items-center justify-center space-x-1.5 mb-1">
          <h1 class="text-3xl font-black text-slate-800 tracking-tight">SATUS</h1>
        </div>
        <p class="text-emerald-700 font-black text-xs tracking-wider uppercase">Satu Tabungan untuk Siswa</p>
        <p class="text-slate-400 mt-1 text-xs">Kantong Hijau Sekolah &bull; Ekonomi Sirkular</p>
      </div>
      
      <!-- Login Form -->
      <form id="login-form" onsubmit="app.handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-slate-700 text-xs font-bold mb-1.5" for="username">Username Akun</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="user" class="w-4 h-4"></i>
            </div>
            <input class="w-full border border-slate-200 rounded-xl py-2.5 pl-10 pr-3.5 text-xs font-medium text-slate-700 placeholder-slate-400 bg-slate-50/50 focus:bg-white focus:border-green-600 transition" id="username" type="text" placeholder="Masukkan username" required autocomplete="username">
          </div>
        </div>

        <div>
          <label class="block text-slate-700 text-xs font-bold mb-1.5" for="password">Kata Sandi (Password)</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </div>
            <input class="w-full border border-slate-200 rounded-xl py-2.5 pl-10 pr-3.5 text-xs font-medium text-slate-700 placeholder-slate-400 bg-slate-50/50 focus:bg-white focus:border-green-600 transition" id="password" type="password" placeholder="Masukkan password" required autocomplete="current-password">
          </div>
        </div>

        <div class="pt-2">
          <button class="w-full bg-gradient-to-r from-green-600 via-emerald-600 to-teal-700 hover:from-green-700 hover:to-teal-800 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-green-600/20 active:scale-[0.98] transition flex items-center justify-center space-x-2 text-xs uppercase tracking-wider" type="submit">
            <i data-lucide="log-in" class="w-4 h-4"></i>
            <span>Masuk ke Akun</span>
          </button>
        </div>
      </form>

      <div class="mt-8 pt-5 border-t border-slate-100 text-center space-y-1">
        <p class="text-[11px] text-slate-500 font-bold">
          &copy; <span id="login-footer-year">2026</span> <b>SATUS</b> &bull; Muhammadiyah 1 Magetan (<span class="text-green-700 font-black">Muhasama</span>)
        </p>
        <p class="text-[10px] text-slate-400 font-medium">Aplikasi Koperasi & Bank Sampah Digital Sekolah</p>
      </div>

    </div>
  </div>
</template>
