<!-- frontend/pages/audit-log.html -->
<template id="tpl-audit-log">
  <div class="space-y-6 max-w-7xl mx-auto pb-10">
    <!-- Header & Search -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-200 pb-4">
      <div class="flex items-center space-x-3">
        <button onclick="app.renderPage('tpl-dashboard-manager')" class="w-10 h-10 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 hover:text-green-700 flex items-center justify-center shadow-sm transition active:scale-95">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <div>
          <h2 class="text-xl font-black text-slate-800 flex items-center gap-2">
            <i data-lucide="clipboard-list" class="w-6 h-6 text-blue-600"></i>
            Audit Log Aktivitas Sistem
          </h2>
          <p class="text-xs text-slate-500 font-medium">Jejak audit seluruh transaksi, perubahan data, dan aktivitas pengguna</p>
        </div>
      </div>
      
      <div class="w-full sm:w-72 relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <i data-lucide="search" class="w-4 h-4"></i>
        </div>
        <input type="text" id="audit-search" onkeyup="app.filterAuditLog()" class="w-full border border-slate-200 rounded-xl py-2 pl-9 pr-3 text-xs bg-white focus:ring-2 focus:ring-green-500/20" placeholder="Cari log (User, Aksi, Deskripsi...)">
      </div>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left">
          <thead class="bg-slate-50 text-slate-600 border-b uppercase font-bold text-[11px]">
            <tr>
              <th class="py-3 px-3.5">Waktu</th>
              <th class="py-3 px-3.5">User</th>
              <th class="py-3 px-3.5">Hak Akses</th>
              <th class="py-3 px-3.5">Aksi</th>
              <th class="py-3 px-3.5">Referensi</th>
              <th class="py-3 px-3.5">Deskripsi Lengkap</th>
            </tr>
          </thead>
          <tbody id="m-audit-table-body" class="divide-y divide-slate-100 font-mono text-[11px]">
            <tr><td colspan="6" class="py-6 text-center text-slate-400 font-sans font-medium">Memuat log aktivitas...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</template>
