<!-- frontend/pages/dashboard-manager.html -->
<template id="tpl-dashboard-manager">
  <div class="space-y-6 max-w-7xl mx-auto pb-10">

    <!-- Header / Profil Manager & Admin -->
    <div id="m-profile-card" class="bg-gradient-to-r from-slate-900 via-slate-800 to-emerald-900 rounded-3xl shadow-lg shadow-slate-950/15 text-white p-6 md:p-8 flex flex-col md:flex-row items-center justify-between relative overflow-hidden">
      <!-- Decorative icon background -->
      <div class="absolute -right-6 -bottom-6 text-white/5 pointer-events-none">
        <i data-lucide="shield-check" style="width: 180px; height: 180px;"></i>
      </div>

      <div class="flex items-center space-x-4 relative z-10 w-full md:w-auto">
        <div class="relative group cursor-pointer" onclick="app.openProfileModal()" title="Ubah Foto Profil">
          <img id="m-avatar" src="https://ui-avatars.com/api/?name=Manager&background=10b981&color=fff&bold=true" class="w-16 h-16 rounded-2xl border-2 border-white/40 object-cover shadow-md group-hover:opacity-90 transition">
          <div class="absolute -bottom-1 -right-1 bg-emerald-700/90 text-white p-1 rounded-lg border border-white/30 backdrop-blur-sm">
            <i data-lucide="camera" class="w-3 h-3"></i>
          </div>
        </div>
        <div>
          <div class="flex flex-wrap items-center gap-2 mb-1.5">
            <span id="m-role-badge" class="bg-emerald-500/25 text-emerald-300 text-[10px] px-2.5 py-0.5 rounded-full font-extrabold uppercase tracking-wider backdrop-blur-sm border border-emerald-400/30">Manager Koperasi</span>
            <span id="m-dev-badge" class="hidden bg-amber-400 text-amber-950 text-[10px] px-2.5 py-0.5 rounded-full font-black uppercase tracking-wider border border-amber-300 shadow-sm flex items-center gap-1 animate-pulse">
              <i data-lucide="flask-conical" class="w-3 h-3 text-amber-950 inline"></i>
              <span>Akun Dev (Testing)</span>
            </span>
          </div>
          <h2 class="text-2xl font-black tracking-tight" id="m-nama">Memuat profil...</h2>
          <p class="text-slate-300 text-xs font-medium" id="m-info">ID: -- | Username: @--</p>
        </div>
      </div>
      
      <div class="flex flex-wrap items-center gap-2.5 relative z-10 w-full md:w-auto justify-start md:justify-end mt-4 md:mt-0">
        <button onclick="app.openProfileModal()" class="bg-white/15 hover:bg-white/25 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl backdrop-blur-sm transition flex items-center space-x-1.5 shadow-sm border border-white/20 active:scale-95" title="Ubah profil atau foto akun">
          <i data-lucide="user" class="w-3.5 h-3.5 text-emerald-300"></i>
          <span>Kelola Profil</span>
        </button>
        <button onclick="app.openProfileModal(); app.switchProfileTab('pass');" class="bg-white/15 hover:bg-white/25 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl backdrop-blur-sm transition flex items-center space-x-1.5 shadow-sm border border-white/20 active:scale-95" title="Ganti Password">
          <i data-lucide="key-round" class="w-3.5 h-3.5 text-yellow-300"></i>
          <span>Ganti Password</span>
        </button>
      </div>
    </div>

    <!-- Top Action Bar -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
      <div>
        <div class="flex items-center space-x-2">
          <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
          <h2 class="text-xl font-black text-slate-800">Dashboard Manager</h2>
        </div>
        <p class="text-xs text-slate-500 font-medium">Monitoring & Pengawasan Koperasi Sekolah SATUS — Kantong Hijau</p>
      </div>
      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <button onclick="app.openModalPengajuanBibitManager()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2.5 rounded-xl shadow-sm transition text-xs font-bold flex items-center space-x-1.5 active:scale-95">
          <i data-lucide="sprout" class="w-4 h-4 text-yellow-300"></i>
          <span>Pengajuan Bibit</span>
          <span id="m-badge-pending-bibit" class="ml-1 bg-yellow-400 text-yellow-950 px-1.5 py-0.2 rounded-full font-black text-[10px]">0</span>
        </button>
        <button onclick="app.openModalVoidManager()" class="bg-rose-600 hover:bg-rose-700 text-white px-3.5 py-2.5 rounded-xl shadow-sm transition text-xs font-bold flex items-center space-x-1.5 active:scale-95">
          <i data-lucide="rotate-ccw" class="w-4 h-4 text-yellow-300"></i>
          <span>Persetujuan Pembatalan</span>
          <span id="m-badge-pending-void" class="ml-1 bg-yellow-400 text-yellow-950 px-1.5 py-0.2 rounded-full font-black text-[10px]">0</span>
        </button>
        <button onclick="app.openLaporanManager()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2.5 rounded-xl shadow-sm transition text-xs font-bold flex items-center space-x-1.5 active:scale-95">
          <i data-lucide="file-bar-chart" class="w-4 h-4"></i>
          <span>Laporan Periodik</span>
        </button>
        <button onclick="app.openImpactReport()" class="bg-green-700 hover:bg-green-800 text-white px-3.5 py-2.5 rounded-xl shadow-sm transition text-xs font-bold flex items-center space-x-1.5 active:scale-95">
          <i data-lucide="globe" class="w-4 h-4 text-yellow-300"></i>
          <span>Impact Report</span>
        </button>
        <button onclick="app.openModalAppVersionManager()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2.5 rounded-xl shadow-sm transition text-xs font-bold flex items-center space-x-1.5 active:scale-95">
          <i data-lucide="smartphone" class="w-4 h-4 text-indigo-200"></i>
          <span>Kontrol Versi Mobile</span>
          <span id="m-badge-version-type" class="ml-1 bg-indigo-200 text-indigo-950 px-1.5 py-0.5 rounded-full font-bold text-[9px]">v2.0.0</span>
        </button>
        <button onclick="app.openModalScheduleNotification()" class="bg-amber-600 hover:bg-amber-700 text-white px-3.5 py-2.5 rounded-xl shadow-sm transition text-xs font-bold flex items-center space-x-1.5 active:scale-95">
          <i data-lucide="clock" class="w-4 h-4 text-amber-200"></i>
          <span>Jadwal Notifikasi</span>
        </button>
        <button onclick="app.openModalAnnouncement()" class="bg-purple-600 hover:bg-purple-700 text-white px-3.5 py-2.5 rounded-xl shadow-sm transition text-xs font-bold flex items-center space-x-1.5 active:scale-95">
          <i data-lucide="megaphone" class="w-4 h-4 text-purple-200"></i>
          <span>Buat Pengumuman</span>
        </button>
      </div>
    </div>

    <!-- Summary Cards (PRD v2 Poin 12) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      
      <!-- Card 1: Pengguna -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col justify-between hover:shadow-md transition">
        <div>
          <div class="flex items-center justify-between text-xs text-slate-500 font-bold mb-1">
            <span>TOTAL PENGGUNA</span>
            <i data-lucide="users" class="w-4 h-4 text-slate-400"></i>
          </div>
          <div class="text-2xl font-black text-slate-800 mb-2" id="m-total-anggota">--</div>
        </div>
        
        <div class="text-[11px] text-slate-600 space-y-1 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
          <div class="flex justify-between items-center border-b border-slate-200/60 pb-1">
            <span class="font-bold">Siswa (<span id="m-total-siswa">--</span>)</span>
            <span class="flex space-x-2">
              <span class="text-green-600 font-semibold flex items-center gap-0.5"><i data-lucide="check-circle-2" class="w-3 h-3"></i> <span id="m-siswa-aktif">--</span></span>
              <span class="text-yellow-600 font-semibold flex items-center gap-0.5"><i data-lucide="clock" class="w-3 h-3"></i> <span id="m-siswa-menunggu">--</span></span>
              <span class="text-red-500 font-semibold flex items-center gap-0.5"><i data-lucide="x-circle" class="w-3 h-3"></i> <span id="m-siswa-nonaktif">--</span></span>
            </span>
          </div>
          <div class="flex justify-between items-center text-[10px] pt-0.5">
            <span>Kasir: <b class="text-green-600" id="m-kasir-aktif">--</b> / <span id="m-total-kasir">--</span></span>
            <span>Manager: <b class="text-green-600" id="m-admin-aktif">--</b> / <span id="m-total-admin">--</span></span>
          </div>
        </div>
      </div>
      
      <!-- Card 2: Dual Saldo Global -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col justify-between hover:shadow-md transition">
        <div>
          <div class="flex items-center justify-between text-xs text-slate-500 font-bold mb-1">
            <span>TOTAL SALDO GLOBAL</span>
            <i data-lucide="wallet" class="w-4 h-4 text-slate-400"></i>
          </div>
          <div class="text-2xl font-black text-slate-800 mt-0.5" id="m-total-saldo">Rp --</div>
        </div>
        
        <div class="grid grid-cols-2 gap-2 mt-3 pt-2 border-t border-slate-100 text-[11px]">
          <div class="bg-green-50 p-2 rounded-xl border border-green-100 text-center">
            <p class="text-[10px] text-green-700 font-bold uppercase">💰 Tabungan</p>
            <p class="font-extrabold text-green-800 text-xs mt-0.5" id="m-total-saldo-tabungan">Rp 0</p>
          </div>
          <div class="bg-emerald-900 text-white p-2 rounded-xl text-center shadow-inner">
            <p class="text-[10px] text-emerald-300 font-bold uppercase">🌱 Hijau</p>
            <p class="font-extrabold text-emerald-200 text-xs mt-0.5" id="m-total-saldo-hijau">Rp 0</p>
          </div>
        </div>
      </div>
      
      <!-- Card 3: Sampah Terkumpul -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col justify-between hover:shadow-md transition">
        <div>
          <div class="flex items-center justify-between text-xs text-slate-500 font-bold mb-1">
            <span>SAMPAH TERKUMPUL</span>
            <i data-lucide="recycle" class="w-4 h-4 text-emerald-600"></i>
          </div>
          <div class="flex justify-between mt-1 gap-2">
            <div class="bg-green-50 p-2 rounded-xl text-center w-full border border-green-100">
              <div class="text-base font-extrabold text-green-700" id="m-plastik">-- Kg</div>
              <div class="text-[10px] text-slate-500 font-bold">PLASTIK</div>
            </div>
            <div class="bg-yellow-50 p-2 rounded-xl text-center w-full border border-yellow-100">
              <div class="text-base font-extrabold text-yellow-700" id="m-jelantah">-- L</div>
              <div class="text-[10px] text-slate-500 font-bold">JELANTAH</div>
            </div>
          </div>
        </div>
        <div class="text-[11px] text-slate-500 mt-2 border-t border-slate-100 pt-1.5 flex justify-between">
          <span>Nilai Ekonomi Sampah:</span>
          <span class="font-bold text-slate-800" id="m-nilai-ekonomi">Rp 0</span>
        </div>
      </div>
      
      <!-- Card 4: Program Bibit & Sirkular -->
      <div class="bg-gradient-to-br from-emerald-800 via-emerald-900 to-teal-950 text-white p-5 rounded-2xl shadow-sm flex flex-col justify-between hover:shadow-md transition">
        <div>
          <div class="flex items-center justify-between text-xs text-emerald-200 font-bold mb-1">
            <span>PROGRAM PENGHIJAUAN</span>
            <i data-lucide="trees" class="w-4 h-4 text-emerald-300"></i>
          </div>
          <div class="flex justify-between mt-1 gap-2">
            <div class="bg-white/10 p-2 rounded-xl text-center w-full border border-white/10">
              <div class="text-base font-extrabold text-yellow-300" id="m-bibit-terkonversi">0</div>
              <div class="text-[10px] text-emerald-200 font-bold">BIBIT DISETUJUI</div>
            </div>
            <div class="bg-white/10 p-2 rounded-xl text-center w-full border border-white/10">
              <div class="text-base font-extrabold text-white" id="m-atk-ditukar">0</div>
              <div class="text-[10px] text-emerald-200 font-bold">ATK DITUKAR</div>
            </div>
          </div>
        </div>
        <div class="text-[11px] text-emerald-200 mt-2 border-t border-emerald-700/60 pt-1.5 flex justify-between items-center">
          <span>Pengajuan Menunggu: <b class="font-extrabold text-yellow-300" id="m-pengajuan-menunggu">0 Pengajuan</b></span>
          <button type="button" onclick="app.openModalPengajuanBibitManager(); app.switchBibitTab('dashboard');" class="text-[10px] bg-emerald-700/70 hover:bg-emerald-600 text-emerald-100 px-2 py-0.5 rounded-lg font-bold flex items-center gap-1 transition active:scale-95 border border-emerald-600/50" title="Lihat & Kelola Target Penanaman Pohon">
            <i data-lucide="target" class="w-3 h-3 text-yellow-300"></i>
            <span>Target: <span id="m-target-bibit-card">500 Bibit</span></span>
          </button>
        </div>
      </div>
      
    </div>

    <!-- Menu Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 mt-4">
      <button onclick="app.renderPage('tpl-member-list')" class="bg-white p-5 rounded-2xl shadow-sm hover:shadow-md transition text-center text-green-700 flex flex-col items-center border border-slate-200/80 active:scale-95">
        <div class="w-12 h-12 rounded-xl bg-green-50 text-green-600 flex items-center justify-center mb-2">
          <i data-lucide="users" class="w-6 h-6"></i>
        </div>
        <span class="font-bold text-xs text-slate-800">Kelola Anggota</span>
      </button>
      <button onclick="app.renderPage('tpl-waste-price')" class="bg-white p-5 rounded-2xl shadow-sm hover:shadow-md transition text-center text-green-700 flex flex-col items-center border border-slate-200/80 active:scale-95">
        <div class="w-12 h-12 rounded-xl bg-yellow-50 text-yellow-600 flex items-center justify-center mb-2">
          <i data-lucide="tags" class="w-6 h-6"></i>
        </div>
        <span class="font-bold text-xs text-slate-800">Harga Sampah</span>
      </button>
      <button onclick="app.renderPage('tpl-product-list')" class="bg-white p-5 rounded-2xl shadow-sm hover:shadow-md transition text-center text-green-700 flex flex-col items-center border border-slate-200/80 active:scale-95">
        <div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center mb-2">
          <i data-lucide="package" class="w-6 h-6"></i>
        </div>
        <span class="font-bold text-xs text-slate-800">Produk & Nilai ATK</span>
      </button>
      <button onclick="app.openModalPengajuanBibitManager()" class="bg-white p-5 rounded-2xl shadow-sm hover:shadow-md transition text-center text-emerald-700 flex flex-col items-center border border-emerald-300 relative active:scale-95">
        <span id="m-menu-badge-bibit" class="hidden absolute top-3 right-3 bg-red-500 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center">0</span>
        <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-2">
          <i data-lucide="sprout" class="w-6 h-6"></i>
        </div>
        <span class="font-bold text-xs text-slate-800">Program Bibit</span>
      </button>
      <button onclick="app.renderPage('tpl-audit-log')" class="bg-white p-5 rounded-2xl shadow-sm hover:shadow-md transition text-center text-green-700 flex flex-col items-center border border-slate-200/80 active:scale-95">
        <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center mb-2">
          <i data-lucide="clipboard-list" class="w-6 h-6"></i>
        </div>
        <span class="font-bold text-xs text-slate-800">Audit Log</span>
      </button>
    </div>
    
    <!-- Modal: Impact Report (PRD v2 Poin 40 - INOTEK Award 2026) -->
    <div id="modal-impact" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-2 sm:p-4 overflow-y-auto" onclick="if(event.target === this) document.getElementById('modal-impact').classList.add('hidden')">
      <div class="bg-white rounded-3xl p-6 sm:p-8 w-full max-w-3xl my-auto shadow-2xl border border-slate-200 text-slate-800 animate-scale-in">
        
        <!-- Header & Top Actions (no-print) -->
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-200 no-print">
          <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center">
              <i data-lucide="globe" class="w-5 h-5"></i>
            </div>
            <div>
              <h3 class="text-sm font-black text-slate-800 uppercase tracking-wide">Executive Impact Report</h3>
              <p class="text-[11px] text-slate-500 font-medium">Laporan Resmi Dampak Program & Inovasi Lingkungan</p>
            </div>
          </div>
          <button onclick="document.getElementById('modal-impact').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100 transition">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- PRINTABLE CONTENT CONTAINER -->
        <div id="impact-printable-area" class="space-y-6">
          
          <!-- Kop Surat / School Formal Header -->
          <div class="border-b-2 border-slate-800 pb-4 flex items-center justify-between gap-4">
            <div class="flex items-center space-x-3.5">
              <div class="w-13 h-13 sm:w-14 sm:h-14 rounded-2xl bg-emerald-700 text-white flex items-center justify-center font-black text-2xl shadow-sm border border-emerald-800 flex-shrink-0">
                🌱
              </div>
              <div>
                <h2 class="text-base sm:text-lg font-black text-slate-900 tracking-tight leading-tight uppercase">SMP MUHAMMADIYAH 1 MAGETAN</h2>
                <p class="text-xs font-extrabold text-emerald-700 tracking-wider uppercase mt-0.5">SATUS &bull; KANTONG HIJAU SEKOLAH</p>
                <p class="text-[11px] text-slate-500 mt-0.5 leading-tight">Sistem Aplikasi Tabungan Siswa & Pengelolaan Sampah Mandiri Bernilai Ekonomi</p>
              </div>
            </div>
            <div class="text-right flex-shrink-0">
              <span class="inline-block bg-emerald-100 text-emerald-800 text-[10px] font-black px-2.5 py-1 rounded-full uppercase tracking-wider border border-emerald-300">
                INOTEK AWARD 2026
              </span>
              <p class="text-[10px] text-slate-400 mt-1 font-mono font-semibold" id="ir-doc-no">DOC: IR-2026-SATUS</p>
              <p class="text-[10px] text-slate-500 font-medium" id="ir-doc-date">--</p>
            </div>
          </div>

          <!-- Document Title & Intro -->
          <div class="bg-gradient-to-r from-emerald-50 via-teal-50 to-green-50 p-4 rounded-2xl border border-emerald-200">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <h4 class="text-xs sm:text-sm font-black text-slate-900 tracking-wide uppercase">LAPORAN CAPAIAN DAMPAK PROGRAM (IMPACT REPORT)</h4>
                <p class="text-xs text-slate-600 mt-0.5">Dokumentasi dampak nyata 3 pilar: Literasi Keuangan, Kelestarian Lingkungan, dan Ekonomi Sirkular.</p>
              </div>
              <div class="text-left sm:text-right flex-shrink-0">
                <span class="text-[10px] text-slate-500 font-medium block">Dicetak oleh:</span>
                <p class="text-xs font-bold text-slate-800" id="ir-printed-by">Administrator SATUS</p>
              </div>
            </div>
          </div>

          <!-- 3 CORE PILLARS GRID -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            
            <!-- Pilar 1: Financial Impact -->
            <div class="bg-white p-4 rounded-2xl border-2 border-emerald-100 shadow-sm flex flex-col justify-between">
              <div>
                <div class="flex items-center space-x-2 text-emerald-700 pb-2 border-b border-emerald-100 mb-3">
                  <i data-lucide="wallet" class="w-4 h-4 text-emerald-600"></i>
                  <h5 class="text-xs font-black uppercase tracking-wider">1. Financial Impact</h5>
                </div>
                <div class="space-y-3">
                  <div>
                    <span class="text-[11px] text-slate-500 block">Siswa Terdaftar</span>
                    <span class="text-lg font-black text-slate-800" id="ir-siswa">0 Siswa</span>
                    <span class="text-[10px] text-emerald-600 block font-semibold" id="ir-siswa-sub">-- Siswa Aktif</span>
                  </div>
                  <div class="border-t border-slate-100 pt-2">
                    <span class="text-[11px] text-slate-500 block">Total Saldo Tabungan (Tunai)</span>
                    <span class="text-base font-extrabold text-green-700" id="ir-tabungan">Rp 0</span>
                  </div>
                  <div class="border-t border-slate-100 pt-2">
                    <span class="text-[11px] text-slate-500 block">Total Saldo Hijau (Sirkular)</span>
                    <span class="text-base font-extrabold text-emerald-700" id="ir-hijau">Rp 0</span>
                  </div>
                </div>
              </div>
              <div class="mt-4 pt-2 border-t-2 border-dashed border-emerald-200 bg-emerald-50/70 -mx-4 -mb-4 p-3 rounded-b-2xl">
                <span class="text-[10px] text-slate-500 block font-bold uppercase">Total Simpanan Beredar</span>
                <span class="text-base font-black text-emerald-900" id="ir-total-saldo">Rp 0</span>
              </div>
            </div>

            <!-- Pilar 2: Environmental Impact -->
            <div class="bg-white p-4 rounded-2xl border-2 border-teal-100 shadow-sm flex flex-col justify-between">
              <div>
                <div class="flex items-center space-x-2 text-teal-700 pb-2 border-b border-teal-100 mb-3">
                  <i data-lucide="trees" class="w-4 h-4 text-teal-600"></i>
                  <h5 class="text-xs font-black uppercase tracking-wider">2. Environmental Impact</h5>
                </div>
                <div class="space-y-3">
                  <div>
                    <span class="text-[11px] text-slate-500 block">Sampah Plastik Terkumpul</span>
                    <span class="text-lg font-black text-teal-800" id="ir-plastik">0 Kg</span>
                    <span class="text-[10px] text-slate-400 block font-medium">Tereduksi dari lingkungan</span>
                  </div>
                  <div class="border-t border-slate-100 pt-2">
                    <span class="text-[11px] text-slate-500 block">Minyak Jelantah Terkumpul</span>
                    <span class="text-base font-extrabold text-teal-800" id="ir-jelantah">0 Liter</span>
