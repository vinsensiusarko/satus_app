<!-- frontend/pages/dashboard-kasir.html -->
<template id="tpl-dashboard-kasir">
  <div class="space-y-6 max-w-7xl mx-auto pb-10">
    
    <!-- Header / Profil Kasir -->
    <div id="k-profile-card" class="bg-gradient-to-r from-slate-900 via-sky-950 to-emerald-950 rounded-3xl shadow-lg shadow-slate-950/15 text-white p-6 md:p-8 flex flex-col md:flex-row items-center justify-between relative overflow-hidden">
      <!-- Decorative icon background -->
      <div class="absolute -right-6 -bottom-6 text-white/5 pointer-events-none">
        <i data-lucide="badge-percent" style="width: 180px; height: 180px;"></i>
      </div>

      <div class="flex items-center space-x-4 relative z-10 w-full md:w-auto">
        <div class="relative group cursor-pointer" onclick="app.openProfileModal()" title="Ubah Foto Profil">
          <img id="k-avatar" src="https://ui-avatars.com/api/?name=Kasir&background=0284c7&color=fff&bold=true" class="w-16 h-16 rounded-2xl border-2 border-white/40 object-cover shadow-md group-hover:opacity-90 transition">
          <div class="absolute -bottom-1 -right-1 bg-sky-700/90 text-white p-1 rounded-lg border border-white/30 backdrop-blur-sm">
            <i data-lucide="camera" class="w-3 h-3"></i>
          </div>
        </div>
        <div>
          <div class="flex flex-wrap items-center gap-2 mb-1.5">
            <span id="k-role-badge" class="bg-sky-500/25 text-sky-300 text-[10px] px-2.5 py-0.5 rounded-full font-extrabold uppercase tracking-wider backdrop-blur-sm border border-sky-400/30">Kasir Koperasi</span>
            <span id="k-dev-badge" class="hidden bg-amber-400 text-amber-950 text-[10px] px-2.5 py-0.5 rounded-full font-black uppercase tracking-wider border border-amber-300 shadow-sm flex items-center gap-1 animate-pulse">
              <i data-lucide="flask-conical" class="w-3 h-3 text-amber-950 inline"></i>
              <span>Akun Dev (Testing)</span>
            </span>
          </div>
          <h2 class="text-2xl font-black tracking-tight" id="k-nama">Memuat profil...</h2>
          <p class="text-slate-300 text-xs font-medium" id="k-info">ID: -- | Username: @--</p>
        </div>
      </div>
      
      <div class="flex flex-wrap items-center gap-2.5 relative z-10 w-full md:w-auto justify-start md:justify-end mt-4 md:mt-0">
        <button onclick="app.openProfileModal()" class="bg-white/15 hover:bg-white/25 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl backdrop-blur-sm transition flex items-center space-x-1.5 shadow-sm border border-white/20 active:scale-95" title="Ubah profil atau foto akun">
          <i data-lucide="user" class="w-3.5 h-3.5 text-sky-300"></i>
          <span>Kelola Profil</span>
        </button>
        <button onclick="app.openProfileModal(); app.switchProfileTab('pass');" class="bg-white/15 hover:bg-white/25 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl backdrop-blur-sm transition flex items-center space-x-1.5 shadow-sm border border-white/20 active:scale-95" title="Ganti Password">
          <i data-lucide="key-round" class="w-3.5 h-3.5 text-yellow-300"></i>
          <span>Ganti Password</span>
        </button>
      </div>
    </div>

    <!-- Top Scanner & Search Card -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
      <div class="flex items-center space-x-2.5 mb-4">
        <div class="w-9 h-9 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center font-bold">
          <i data-lucide="scan-line" class="w-5 h-5"></i>
        </div>
        <div>
          <h2 class="text-lg font-black text-slate-800">Kasir: Mulai Transaksi</h2>
          <p class="text-xs text-slate-500">Cari nomor anggota / scan kartu QR siswa untuk memulai transaksi</p>
        </div>
      </div>
      
      <!-- Pencarian Member ID / NIS Siswa -->
      <div class="mb-6">
        <label class="block text-xs font-bold text-slate-700 mb-1">Cari Member ID / NIS Siswa</label>
        <form onsubmit="app.searchMemberKasir(event)" class="flex">
          <div class="relative flex-grow">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="search" class="w-4 h-4"></i>
            </div>
            <input type="text" id="k-search-input" class="w-full border-slate-200 rounded-l-xl border p-2.5 pl-9 text-xs font-medium focus:ring-2 focus:ring-green-500/20" placeholder="Contoh: KH-2026-001 atau ketik NIS Siswa">
          </div>
          <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-5 rounded-r-xl transition text-xs font-bold flex items-center gap-1.5 active:scale-95">
            <i data-lucide="search" class="w-4 h-4"></i>
            <span>Cari</span>
          </button>
        </form>
      </div>

      <!-- Member Visual Identity Profile Card (Enhanced with Large Avatar & Verification) -->
      <div id="k-member-profile" class="hidden bg-gradient-to-r from-slate-50 via-emerald-50/30 to-green-50/40 border border-green-200/80 p-5 rounded-3xl mb-6 flex flex-col md:flex-row justify-between items-center gap-5 animate-scale-in shadow-sm">
        <div class="flex items-center space-x-4 w-full md:w-auto">
          <div class="relative">
            <img id="k-m-avatar" src="https://ui-avatars.com/api/?name=Siswa&background=10b981&color=fff&bold=true" class="w-16 h-16 rounded-2xl border-2 border-white shadow-md object-cover">
            <div class="absolute -bottom-1 -right-1 bg-green-600 text-white p-1 rounded-full border border-white">
              <i data-lucide="check" class="w-2.5 h-2.5"></i>
            </div>
          </div>
          <div>
            <div class="flex items-center space-x-2 mb-1">
              <span id="k-m-status" class="text-[10px] bg-green-100 text-green-800 font-black px-2.5 py-0.5 rounded-full uppercase tracking-wider border border-green-200">Member Aktif</span>
              <span class="text-[10px] text-slate-400 font-medium">Verifikasi Visual</span>
            </div>
            <h3 class="text-xl font-black text-slate-800 tracking-tight" id="k-m-nama">Nama Siswa</h3>
            <p class="text-xs text-slate-500 font-medium" id="k-m-info">ID: -- | NIS: -- | Kelas: --</p>
          </div>
        </div>
        
        <div class="flex items-center space-x-3 w-full md:w-auto">
          <!-- Saldo Tabungan -->
          <div class="flex-1 md:flex-none bg-white px-4 py-3 rounded-2xl shadow-sm border border-green-200 text-center min-w-[135px]">
            <p class="text-[10px] text-slate-500 font-extrabold uppercase tracking-wide">💰 Saldo Tabungan</p>
            <p class="text-lg font-black text-green-700 mt-0.5" id="k-m-saldo-tabungan">Rp 0</p>
          </div>
          <!-- Saldo Hijau -->
          <div class="flex-1 md:flex-none bg-emerald-950 px-4 py-3 rounded-2xl shadow-sm border border-emerald-800 text-center text-white min-w-[135px]">
            <p class="text-[10px] text-emerald-300 font-extrabold uppercase tracking-wide">🌱 Saldo Hijau</p>
            <p class="text-lg font-black text-emerald-200 mt-0.5" id="k-m-saldo-hijau">Rp 0</p>
          </div>
        </div>
      </div>

      <!-- Mini Riwayat Transaksi Siswa Terpilih (Recent History + Void Button) -->
      <div id="k-member-recent-container" class="hidden mb-6 bg-slate-50 border border-slate-200 rounded-2xl p-4">
        <div class="flex justify-between items-center mb-2.5">
          <h4 class="text-xs font-black text-slate-700 flex items-center gap-1.5">
            <i data-lucide="history" class="w-3.5 h-3.5 text-blue-600"></i>
            Mutasi Terakhir Siswa Ini
          </h4>
          <span class="text-[10px] text-slate-400">Klik 'Ajukan Batal' jika ada salah ketik</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-[11px] text-left">
            <thead class="bg-slate-100 text-slate-600 uppercase font-bold text-[10px]">
              <tr>
                <th class="py-1.5 px-2.5">Waktu &amp; Tanggal</th>
                <th class="py-1.5 px-2">Jenis Transaksi</th>
                <th class="py-1.5 px-2 text-right">Nilai</th>
                <th class="py-1.5 px-2.5 text-right">Status / Aksi</th>
              </tr>
            </thead>
            <tbody id="k-member-recent-tbody" class="divide-y divide-slate-200 font-mono">
              <tr><td colspan="4" class="py-2 text-center text-slate-400">Memuat mutasi...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div>
        <div class="flex items-center justify-between mb-2.5">
          <p class="text-xs font-black text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="sparkles" class="w-4 h-4 text-yellow-500"></i>
            Pilih Jenis Transaksi
          </p>
          <span id="k-tx-hint" class="text-[11px] font-medium text-slate-400">Cari anggota terlebih dahulu</span>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3" id="k-action-buttons">
          
          <!-- 1. Setor Tunai -->
          <button onclick="app.openTxModal('SETOR_TUNAI')" id="btn-setor-tunai" class="group bg-green-100/90 hover:bg-green-200 text-green-950 border-2 border-green-400 p-3.5 rounded-2xl text-center font-black text-xs flex flex-col items-center justify-center space-y-2 shadow-sm hover:shadow-md transition-all duration-200 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
            <div class="w-10 h-10 rounded-xl bg-green-200 text-green-800 flex items-center justify-center font-bold shadow-inner group-hover:scale-110 transition-transform">
              <i data-lucide="wallet" class="w-5 h-5"></i>
            </div>
            <span class="tracking-wide">Setor Tunai</span>
          </button>
          
          <!-- 2. Setor Plastik -->
          <button onclick="app.openTxModal('SETOR_PLASTIK')" id="btn-setor-plastik" class="group bg-emerald-100/90 hover:bg-emerald-200 text-emerald-950 border-2 border-emerald-400 p-3.5 rounded-2xl text-center font-black text-xs flex flex-col items-center justify-center space-y-2 shadow-sm hover:shadow-md transition-all duration-200 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
            <div class="w-10 h-10 rounded-xl bg-emerald-200 text-emerald-800 flex items-center justify-center font-bold shadow-inner group-hover:scale-110 transition-transform">
              <i data-lucide="flask-round" class="w-5 h-5"></i>
            </div>
            <span class="tracking-wide">Setor Plastik</span>
          </button>
          
          <!-- 3. Setor Jelantah -->
          <button onclick="app.openTxModal('SETOR_JELANTAH')" id="btn-setor-jelantah" class="group bg-amber-100/90 hover:bg-amber-200 text-amber-950 border-2 border-amber-400 p-3.5 rounded-2xl text-center font-black text-xs flex flex-col items-center justify-center space-y-2 shadow-sm hover:shadow-md transition-all duration-200 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
            <div class="w-10 h-10 rounded-xl bg-amber-200 text-amber-800 flex items-center justify-center font-bold shadow-inner group-hover:scale-110 transition-transform">
              <i data-lucide="droplets" class="w-5 h-5"></i>
            </div>
            <span class="tracking-wide">Setor Jelantah</span>
          </button>
          
          <!-- 4. Tarik Tunai -->
          <button onclick="app.openTxModal('TARIK_TUNAI')" id="btn-tarik-tunai" class="group bg-blue-100/90 hover:bg-blue-200 text-blue-950 border-2 border-blue-400 p-3.5 rounded-2xl text-center font-black text-xs flex flex-col items-center justify-center space-y-2 shadow-sm hover:shadow-md transition-all duration-200 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
            <div class="w-10 h-10 rounded-xl bg-blue-200 text-blue-800 flex items-center justify-center font-bold shadow-inner group-hover:scale-110 transition-transform">
              <i data-lucide="banknote" class="w-5 h-5"></i>
            </div>
            <span class="tracking-wide">Tarik Tunai</span>
          </button>
          
          <!-- 5. Belanja Tabungan -->
          <button onclick="app.openTxModal('BELANJA_TABUNGAN')" id="btn-belanja" class="group bg-purple-100/90 hover:bg-purple-200 text-purple-950 border-2 border-purple-400 p-3.5 rounded-2xl text-center font-black text-xs flex flex-col items-center justify-center space-y-2 shadow-sm hover:shadow-md transition-all duration-200 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
            <div class="w-10 h-10 rounded-xl bg-purple-200 text-purple-800 flex items-center justify-center font-bold shadow-inner group-hover:scale-110 transition-transform">
              <i data-lucide="shopping-cart" class="w-5 h-5"></i>
            </div>
            <span class="tracking-wide">Belanja Tabungan</span>
          </button>
          
          <!-- 6. Tukar ATK Hijau -->
          <button onclick="app.openTxModal('TUKAR_HIJAU_ATK')" id="btn-tukar-hijau" class="group bg-teal-100/90 hover:bg-teal-200 text-teal-950 border-2 border-teal-400 p-3.5 rounded-2xl text-center font-black text-xs flex flex-col items-center justify-center space-y-2 shadow-sm hover:shadow-md transition-all duration-200 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
            <div class="w-10 h-10 rounded-xl bg-teal-200 text-teal-800 flex items-center justify-center font-bold shadow-inner group-hover:scale-110 transition-transform">
              <i data-lucide="pencil" class="w-5 h-5"></i>
            </div>
            <span class="tracking-wide">Tukar ATK Hijau</span>
          </button>

        </div>
      </div>
    </div>
    
    <!-- Table: Riwayat & Seluruh Transaksi Kasir -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4 pb-3 border-b border-slate-100">
        <div>
          <h3 class="font-extrabold text-slate-800 text-sm flex items-center gap-1.5">
            <i data-lucide="history" class="w-4 h-4 text-blue-600"></i>
            Riwayat &amp; Seluruh Transaksi Kasir
          </h3>
          <p class="text-xs text-slate-400">Pantau seluruh transaksi kasir secara real-time maupun histori sebelumnya</p>
        </div>
        
        <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto">
          <!-- Filter Tabs: Hari Ini vs Semua -->
          <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
            <button type="button" onclick="app.switchKasirTxFilter('TODAY')" id="ktx-tab-today" class="px-3 py-1.5 rounded-lg bg-white text-blue-800 shadow-sm transition">
              Hari Ini (<span id="k-total-tx-hari-ini">0</span>)
            </button>
            <button type="button" onclick="app.switchKasirTxFilter('ALL')" id="ktx-tab-all" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-800 transition">
              Semua Histori (<span id="k-total-tx-all">0</span>)
            </button>
          </div>

          <!-- Quick Search -->
          <div class="relative flex-grow sm:w-60">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="search" class="w-3.5 h-3.5"></i>
            </div>
            <input type="text" id="k-tx-search" onkeyup="app.filterKasirTxList()" class="w-full border border-slate-200 rounded-xl py-1.5 pl-8 pr-3 text-xs bg-slate-50 focus:bg-white" placeholder="Cari No TRX / NIS / Jenis...">
          </div>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left">
          <thead class="bg-slate-50 text-slate-600 border-b uppercase font-bold text-[11px]">
            <tr>
              <th class="py-2.5 px-3.5">Waktu &amp; Tanggal</th>
              <th class="py-2.5 px-3.5">ID Transaksi</th>
              <th class="py-2.5 px-3.5">Member ID</th>
              <th class="py-2.5 px-3.5">Jenis &amp; Dompet</th>
              <th class="py-2.5 px-3.5 text-right">Nilai Transaksi</th>
              <th class="py-2.5 px-4 text-right whitespace-nowrap">Status / Aksi</th>
            </tr>
          </thead>
          <tbody id="k-tx-list" class="divide-y divide-slate-100 font-mono text-[11px]">
            <tr><td colspan="6" class="py-6 text-center text-slate-400 font-sans font-medium">Memuat transaksi...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    
    <!-- Modal: Pre-Flight Confirmation (Konfirmasi Sebelum Eksekusi) -->
    <div id="modal-confirm-transaction" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-[70] p-4">
      <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl animate-scale-in border border-slate-100">
        <div class="text-center mb-4">
          <div class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center mx-auto mb-2 font-black">
            <i data-lucide="shield-alert" class="w-6 h-6"></i>
          </div>
          <h3 class="text-lg font-black text-slate-800">Konfirmasi Transaksi</h3>
          <p class="text-xs text-slate-500">Periksa kembali rincian transaksi sebelum diproses</p>
        </div>

        <div class="bg-slate-50 p-4 rounded-2xl text-xs space-y-2.5 mb-5 border border-slate-200">
          <div class="flex items-center space-x-3 pb-2.5 border-b border-slate-200">
            <img id="conf-avatar" src="https://ui-avatars.com/api/?name=Siswa" class="w-10 h-10 rounded-xl object-cover border">
            <div>
              <p class="font-black text-slate-800" id="conf-nama">Nama Siswa</p>
              <p class="text-[11px] text-slate-500" id="conf-info">NIS: -- | Kelas: --</p>
            </div>
          </div>

          <div class="flex justify-between text-slate-600">
            <span>Jenis Transaksi:</span>
            <span class="font-bold text-slate-800" id="conf-type">--</span>
          </div>

          <div class="flex justify-between text-slate-600">
            <span>Rincian / Keterangan:</span>
            <span class="font-medium text-slate-800 text-right" id="conf-desc">--</span>
          </div>

          <div class="flex justify-between text-sm pt-1 border-t border-slate-200">
            <span class="font-extrabold text-slate-800">Nilai Transaksi:</span>
            <span class="font-black text-green-700 text-base" id="conf-amount">Rp 0</span>
          </div>

          <div class="bg-white p-2.5 rounded-xl border border-slate-200/80 space-y-1 text-[11px]">
            <div class="flex justify-between text-slate-500">
              <span>Saldo Saat Ini:</span>
              <span class="font-bold" id="conf-curr-balance">Rp 0</span>
            </div>
            <div class="flex justify-between text-emerald-700 font-extrabold">
              <span>Estimasi Saldo Baru:</span>
              <span id="conf-next-balance">Rp 0</span>
            </div>
          </div>
        </div>

        <div class="flex gap-2">
          <button type="button" onclick="app.closeConfirmModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">Cek Kembali</button>
          <button type="button" id="btn-execute-confirmed-tx" onclick="app.executeConfirmedTransaction()" class="flex-1 py-2.5 bg-green-600 hover:bg-green-700 text-white rounded-xl text-xs font-bold shadow-md flex items-center justify-center gap-1.5">
            <i data-lucide="check" class="w-4 h-4"></i>
            <span>Konfirmasi &amp; Proses</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Modal: Kwitansi Bukti Transaksi (Enhanced Modern Thermal & WA Share) -->
    <div id="modal-kwitansi" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-[60] p-4" onclick="if(event.target === this) document.getElementById('modal-kwitansi').classList.add('hidden')">
      <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl animate-scale-in border border-slate-100">
        <div id="kw-icon-container" class="w-14 h-14 bg-green-100 rounded-2xl flex items-center justify-center mx-auto mb-3 text-green-600 text-2xl shadow-inner transition-colors">
          <i id="kw-icon" data-lucide="check-circle-2" class="w-8 h-8"></i>
        </div>
        <h3 id="kw-title" class="text-lg font-black mb-0.5 text-slate-800">Transaksi Berhasil!</h3>
        <div id="kw-status-badge" class="hidden my-1.5"></div>
        <p class="text-xs text-slate-400 mb-4 font-mono font-bold">No: <span id="kw-id"></span></p>
        
        <div class="bg-slate-50 p-4 rounded-2xl text-left text-xs space-y-2 mb-4 border border-dashed border-slate-300">
          <div class="flex justify-between border-b border-dashed border-slate-200 pb-1.5"><span class="text-slate-500">Jenis:</span><span id="kw-type" class="font-bold text-slate-800"></span></div>
          <div class="flex justify-between border-b border-dashed border-slate-200 pb-1.5"><span class="text-slate-500">Dompet:</span><span id="kw-wallet" class="font-bold text-slate-800"></span></div>
          <div class="flex justify-between border-b border-dashed border-slate-200 pb-1.5"><span class="text-slate-500">Anggota:</span><span id="kw-member" class="font-bold text-slate-800"></span></div>
          <div class="flex justify-between border-b border-dashed border-slate-200 pb-1.5"><span class="text-slate-500">Keterangan:</span><span id="kw-desc" class="text-right text-slate-700 font-medium"></span></div>
          <div class="flex justify-between text-sm pt-1"><span class="text-slate-800 font-bold">Total Nilai:</span><span id="kw-total" class="font-black text-green-700"></span></div>
          <div id="kw-saldo-row" class="flex justify-between text-[11px] pt-1 text-slate-500 border-t border-slate-200"><span class="text-slate-500">Saldo Akhir:</span><span id="kw-saldo" class="font-bold text-slate-800"></span></div>
        </div>
        
        <div class="space-y-2 no-print print:hidden">
          <div class="flex gap-2">
            <button type="button" onclick="app.copyReceiptWhatsApp()" class="flex-1 py-2.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm active:scale-95">
              <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
              <span>Salin Teks WA</span>
            </button>
            <button type="button" onclick="window.print()" class="flex-1 py-2.5 text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 active:scale-95">
              <i data-lucide="printer" class="w-3.5 h-3.5"></i>
              <span>Cetak Struk</span>
            </button>
          </div>
