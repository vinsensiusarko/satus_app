<script>
// Use <script> tag here because GAS include() injects content directly into the HTML
const app = {


  // PROFILE & PASSWORD MANAGEMENT
  selectedPhotoDataUrl: null,

  openProfileModal: function() {
    if (!this.session) return;
    const modal = document.getElementById('modal-profile');
    if (!modal) return;

    this.switchProfileTab('photo');
    this.selectedPhotoDataUrl = null;
    
    const preview = document.getElementById('profile-modal-avatar-preview');
    const avatar = this.formatPhotoUrl(this.session.photoUrl || this.session.photo_url, this.session.nama || this.session.username);
    if (preview) preview.src = avatar;

    modal.classList.remove('hidden');
    if (typeof lucide !== 'undefined') lucide.createIcons();
  },

  closeProfileModal: function() {
    const modal = document.getElementById('modal-profile');
    if (modal) modal.classList.add('hidden');
  },

  switchProfileTab: function(tab) {
    const photoTabBtn = document.getElementById('tab-btn-profile-photo');
    const passTabBtn = document.getElementById('tab-btn-profile-pass');
    const photoContent = document.getElementById('tab-content-profile-photo');
    const passContent = document.getElementById('tab-content-profile-password');

    if (tab === 'photo') {
      if (photoTabBtn) { photoTabBtn.className = 'flex-1 py-2 text-xs font-bold text-green-600 border-b-2 border-green-600 flex items-center justify-center gap-1.5'; }
      if (passTabBtn) { passTabBtn.className = 'flex-1 py-2 text-xs font-bold text-slate-400 hover:text-slate-600 flex items-center justify-center gap-1.5'; }
      if (photoContent) photoContent.classList.remove('hidden');
      if (passContent) passContent.classList.add('hidden');
    } else {
      if (photoTabBtn) { photoTabBtn.className = 'flex-1 py-2 text-xs font-bold text-slate-400 hover:text-slate-600 flex items-center justify-center gap-1.5'; }
      if (passTabBtn) { passTabBtn.className = 'flex-1 py-2 text-xs font-bold text-green-600 border-b-2 border-green-600 flex items-center justify-center gap-1.5'; }
      if (photoContent) photoContent.classList.add('hidden');
      if (passContent) passContent.classList.remove('hidden');
    }
  },

  handleProfilePhotoSelect: function(input) {
    if (input.files && input.files[0]) {
      const file = input.files[0];
      if (!file.type.startsWith('image/')) {
        this.showToast('Harap pilih file gambar (JPG / PNG)', 'error');
        return;
      }
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 150;
          let w = img.width;
          let h = img.height;
          if (w > h) {
            if (w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            }
          } else {
            if (h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);
          
          app.selectedPhotoDataUrl = compressedDataUrl;
          const preview = document.getElementById('profile-modal-avatar-preview');
          if (preview) preview.src = compressedDataUrl;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  },

  resetAvatarToInitial: function() {
    if (!this.session) return;
    const initialAvatar = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(this.session.nama || this.session.username) + '&background=10b981&color=fff&bold=true';
    this.selectedPhotoDataUrl = initialAvatar;
    const preview = document.getElementById('profile-modal-avatar-preview');
    if (preview) preview.src = initialAvatar;
  },

  saveProfilePhoto: function() {
    if (!this.session || !this.session.token) {
      this.showToast('Sesi login tidak valid atau telah berakhir', 'error');
      return;
    }
    if (!this.selectedPhotoDataUrl) {
      this.showToast('Pilih foto baru terlebih dahulu', 'error');
      return;
    }

    const photoToSave = this.selectedPhotoDataUrl;
    this.showLoading(true);
    google.script.run
      .withSuccessHandler((res) => {
        this.showLoading(false);
        if (res.success) {
          const newToken = res.token || (res.data && res.data.token) || (this.session ? this.session.token : null);
          const newPhoto = (res.data && (res.data.photoUrl || res.data.photo_url)) || photoToSave;
          
          if (this.session) {
            this.session = {
              ...this.session,
              ...(res.data || {}),
              photoUrl: newPhoto,
              photo_url: newPhoto,
              token: newToken || this.session.token
            };
            this.saveSession(this.session);
          }
          this.updateNavProfile();
          this.closeProfileModal();
          this.showToast(res.message || 'Foto profil berhasil diperbarui!', 'success');
          
          const sAvatar = document.getElementById('s-avatar');
          if (sAvatar) {
            sAvatar.src = this.formatPhotoUrl(newPhoto, this.session ? (this.session.nama || this.session.username) : 'Siswa');
          }
        } else {
          this.showToast(res.message || 'Gagal memperbarui foto profil', 'error');
        }
      })
      .withFailureHandler((err) => app.handleError(err))
      .updateMyProfile(this.session.token, { photo_url: this.selectedPhotoDataUrl });
  },

  submitChangePassword: function(e) {
    e.preventDefault();
    const oldPass = document.getElementById('cp-old-pass').value;
    const newPass = document.getElementById('cp-new-pass').value;
    const confirmPass = document.getElementById('cp-confirm-pass').value;

    if (newPass !== confirmPass) {
      this.showToast('Konfirmasi password baru tidak cocok', 'error');
      return;
    }

    if (newPass.length < 4) {
      this.showToast('Password baru minimal 4 karakter', 'error');
      return;
    }

    this.showLoading(true);
    google.script.run
      .withSuccessHandler((res) => {
        this.showLoading(false);
        if (res.success) {
          document.getElementById('cp-old-pass').value = '';
          document.getElementById('cp-new-pass').value = '';
          document.getElementById('cp-confirm-pass').value = '';
          this.closeProfileModal();
          this.showToast('Password berhasil diubah!', 'success');
        } else {
          this.showToast(res.message, 'error');
        }
      })
      .withFailureHandler((err) => app.handleError(err))
      .changePassword(this.session.token, oldPass, newPass);
  },

  formatPhotoUrl: function(url, name) {
    if (!url || typeof url !== 'string' || !url.trim()) {
      return 'https://ui-avatars.com/api/?name=' + encodeURIComponent(name || 'Siswa') + '&background=10b981&color=fff&bold=true';
    }
    const cleanUrl = url.trim();
    if (cleanUrl.includes('drive.google.com')) {
      const match = cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || cleanUrl.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w500';
      }
    }
    return cleanUrl;
  },

  updateNavProfile: function() {
    const navUsername = document.getElementById('nav-username');
    const navRole = document.getElementById('nav-user-role');
    const navAvatar = document.getElementById('nav-user-avatar');

    if (!this.session) {
      if (navUsername) navUsername.innerText = '';
      if (navRole) navRole.innerText = '';
      if (navAvatar) navAvatar.src = 'https://ui-avatars.com/api/?name=User&background=10b981&color=fff&bold=true';
      return;
    }

    if (navUsername) navUsername.innerText = this.session.nama || this.session.username;
    if (navRole) navRole.innerText = this.session.role;
    if (navAvatar) {
      const defaultAvatar = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(this.session.nama || this.session.username) + '&background=10b981&color=fff&bold=true';
      navAvatar.src = this.formatPhotoUrl(this.session.photoUrl || this.session.photo_url, this.session.nama || this.session.username);
      navAvatar.onerror = function() {
        this.onerror = null;
        this.src = defaultAvatar;
      };
    }
  },


  // PENDING TRANSACTION & CONFIRMATION
  pendingTxData: null,
  lastKwitansiData: null,

  openConfirmModal: function(data) {
    this.pendingTxData = data;
    const modal = document.getElementById('modal-confirm-transaction');
    if (!modal) return;

    // Set Student Details
    const avatarEl = document.getElementById('conf-avatar');
    if (avatarEl && this.currentMember) {
      const photo = this.formatPhotoUrl(this.currentMember.photoUrl || this.currentMember.photo_url, this.currentMember.nama);
      avatarEl.src = photo;
      avatarEl.onerror = function() {
        this.onerror = null;
        this.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(app.currentMember ? app.currentMember.nama : 'Siswa') + '&background=10b981&color=fff&bold=true';
      };
    }
    const namaEl = document.getElementById('conf-nama');
    if (namaEl && this.currentMember) namaEl.innerText = this.currentMember.nama;
    const infoEl = document.getElementById('conf-info');
    if (infoEl && this.currentMember) infoEl.innerText = 'NIS: ' + this.currentMember.nis + ' | Kelas: ' + this.currentMember.kelas;

    // Set Transaction Details
    document.getElementById('conf-type').innerText = data.typeTitle;
    document.getElementById('conf-desc').innerText = data.desc;
    document.getElementById('conf-amount').innerText = 'Rp ' + data.amount.toLocaleString('id-ID');
    document.getElementById('conf-curr-balance').innerText = data.walletTitle + ': Rp ' + data.currBalance.toLocaleString('id-ID');
    document.getElementById('conf-next-balance').innerText = 'Rp ' + data.nextBalance.toLocaleString('id-ID');

    // Reset execute button state
    const btnExec = document.getElementById('btn-execute-confirmed-tx');
    if (btnExec) {
      btnExec.disabled = false;
      btnExec.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i><span>Konfirmasi &amp; Proses</span>';
    }

    modal.classList.remove('hidden');
    if (typeof lucide !== 'undefined') lucide.createIcons();
  },

  closeConfirmModal: function() {
    const modal = document.getElementById('modal-confirm-transaction');
    if (modal) modal.classList.add('hidden');
    this.pendingTxData = null;
  },

  executeConfirmedTransaction: function() {
    if (!this.pendingTxData) return;
    const data = this.pendingTxData;
    const btnExec = document.getElementById('btn-execute-confirmed-tx');
    if (btnExec) {
      btnExec.disabled = true;
      btnExec.innerHTML = '<span class="spinner w-4 h-4 border-2 mr-1"></span><span>Memproses...</span>';
    }

    this.showLoading(true);

    if (data.category === 'TUNAI') {
      const action = data.type === 'SETOR_TUNAI' ? 'createSetorTunai' : 'createTarikTunai';
      google.script.run
        .withSuccessHandler((res) => {
          this.showLoading(false);
          this.closeConfirmModal();
          document.getElementById('modal-tunai').classList.add('hidden');
          if (res.success) {
            this.showToast(res.message, 'success');
            document.getElementById('tunai-amount').value = '';
            this.currentMember.saldoTabungan = res.newBalance;
            document.getElementById('k-m-saldo-tabungan').innerText = 'Rp ' + res.newBalance.toLocaleString('id-ID');
            this.showKwitansi({
              transactionId: res.transactionId,
              type: data.type,
              walletType: 'TABUNGAN',
              memberId: this.currentMember.member_id,
              desc: data.type === 'SETOR_TUNAI' ? 'Setor tunai tabungan' : 'Tarik tunai tabungan',
              amount: data.amount,
              newBalance: res.newBalance,
              dualBalance: res.dualBalance
            });
            this.loadKasirDashboard();
            this.loadMemberRecentTransactions(this.currentMember.member_id);
          } else {
            this.showToast(res.message, 'error');
          }
        })
        .withFailureHandler((err) => {
          this.closeConfirmModal();
          app.handleError(err);
        })
        [action](this.session.token, this.currentMember.member_id, data.amount);

    } else if (data.category === 'SAMPAH') {
      google.script.run
        .withSuccessHandler((res) => {
          this.showLoading(false);
          this.closeConfirmModal();
          document.getElementById('modal-sampah').classList.add('hidden');
          if (res.success) {
            this.showToast(res.message, 'success');
            document.getElementById('sampah-qty').value = '';
            this.currentMember.saldoHijau = res.newBalance;
            document.getElementById('k-m-saldo-hijau').innerText = 'Rp ' + res.newBalance.toLocaleString('id-ID');
            this.showKwitansi({
              transactionId: res.transactionId,
              type: 'SETOR_' + data.wasteType,
              walletType: 'HIJAU',
              memberId: this.currentMember.member_id,
              desc: data.desc,
              amount: data.amount,
              newBalance: res.newBalance,
              dualBalance: res.dualBalance
            });
            this.loadKasirDashboard();
            this.loadMemberRecentTransactions(this.currentMember.member_id);
          } else {
            this.showToast(res.message, 'error');
          }
        })
        .withFailureHandler((err) => {
          this.closeConfirmModal();
          app.handleError(err);
        })
        .createSetorSampah(this.session.token, this.currentMember.member_id, data.wasteType, data.qty);

    } else if (data.category === 'BELANJA') {
      google.script.run
        .withSuccessHandler((res) => {
          this.showLoading(false);
          this.closeConfirmModal();
          document.getElementById('modal-belanja').classList.add('hidden');
          if (res.success) {
            this.showToast(res.message, 'success');
            if (data.walletType === 'HIJAU') {
              this.currentMember.saldoHijau = res.newBalance;
              document.getElementById('k-m-saldo-hijau').innerText = 'Rp ' + res.newBalance.toLocaleString('id-ID');
            } else {
              this.currentMember.saldoTabungan = res.newBalance;
              document.getElementById('k-m-saldo-tabungan').innerText = 'Rp ' + res.newBalance.toLocaleString('id-ID');
            }
            this.showKwitansi({
              transactionId: res.transactionId,
              type: data.walletType === 'HIJAU' ? 'TUKAR_HIJAU_ATK' : 'BELANJA_TABUNGAN',
              walletType: data.walletType,
              memberId: this.currentMember.member_id,
              desc: data.desc,
              amount: data.amount,
              newBalance: res.newBalance,
              dualBalance: res.dualBalance
            });
            this.cart = [];
            this.renderCart();
            this.loadKasirDashboard();
            this.loadMemberRecentTransactions(this.currentMember.member_id);
          } else {
            this.showToast(res.message, 'error');
          }
        })
        .withFailureHandler((err) => {
          this.closeConfirmModal();
          app.handleError(err);
        })
        .createBelanja(this.session.token, this.currentMember.member_id, data.cart, data.walletType);
    }
  },

  // QUICK AMOUNT & LIVE CALCULATOR
  addQuickAmount: function(val) {
    const input = document.getElementById('tunai-amount');
    if (!input) return;
    const curr = parseFloat(input.value) || 0;
    input.value = curr + val;
  },

  setMaxWithdraw: function() {
    if (!this.currentMember) return;
    const max = this.currentMember.saldoTabungan || 0;
    document.getElementById('tunai-amount').value = max;
  },

  updateLiveWasteSubtotal: function() {
    const qty = parseFloat(document.getElementById('sampah-qty').value) || 0;
    const type = document.getElementById('sampah-type').value;
    const priceInfo = this.currentWastePrices[type];
    const unitPrice = priceInfo ? priceInfo.price : 0;
    const total = qty * unitPrice;

    const formulaEl = document.getElementById('sampah-calc-formula');
    const totalEl = document.getElementById('sampah-calc-total');

    if (formulaEl) formulaEl.innerText = qty + ' ' + (priceInfo ? priceInfo.unit : '') + ' x Rp ' + unitPrice.toLocaleString('id-ID');
    if (totalEl) totalEl.innerText = 'Rp ' + total.toLocaleString('id-ID');
  },

  // PREPARE SUBMISSIONS (TRIGGER CONFIRM MODAL)
  prepareTunaiSubmit: function(e) {
    e.preventDefault();
    const type = document.getElementById('tunai-type').value;
    const amount = parseFloat(document.getElementById('tunai-amount').value);

    if (isNaN(amount) || amount <= 0) {
      this.showToast('Nominal harus lebih dari 0', 'error');
      return;
    }

    if (amount > 500000) {
      if (!confirm('Nominal Rp ' + amount.toLocaleString('id-ID') + ' cukup besar. Apakah Anda yakin nominal ini sudah benar?')) {
        return;
      }
    }

    const currBal = this.currentMember.saldoTabungan || 0;
    if (type === 'TARIK_TUNAI') {
      if (currBal < amount) {
        this.showToast('Saldo tabungan tidak mencukupi (Saldo: Rp ' + currBal.toLocaleString('id-ID') + ')', 'error');
        return;
      }
    }

    const nextBal = type === 'SETOR_TUNAI' ? (currBal + amount) : (currBal - amount);

    this.openConfirmModal({
      category: 'TUNAI',
      type: type,
      typeTitle: type === 'SETOR_TUNAI' ? '💰 Setor Tunai Tabungan' : '💸 Tarik Tunai Tabungan',
      desc: type === 'SETOR_TUNAI' ? 'Penambahan Saldo Tabungan' : 'Penarikan Uang Tabungan',
      amount: amount,
      walletTitle: 'Saldo Tabungan',
      currBalance: currBal,
      nextBalance: nextBal
    });
  },

  prepareSampahSubmit: function(e) {
    e.preventDefault();
    const type = document.getElementById('sampah-type').value;
    const qty = parseFloat(document.getElementById('sampah-qty').value);

    if (isNaN(qty) || qty <= 0) {
      this.showToast('Berat/volume sampah harus lebih dari 0', 'error');
      return;
    }

    if (qty > 50) {
      if (!confirm('Kuantitas ' + qty + ' tergolong sangat besar. Apakah angka timbangan sudah sesuai?')) {
        return;
      }
    }

    const priceInfo = this.currentWastePrices[type];
    const totalAmount = (priceInfo ? priceInfo.price : 0) * qty;
    const currBal = this.currentMember.saldoHijau || 0;
    const nextBal = currBal + totalAmount;

    this.openConfirmModal({
      category: 'SAMPAH',
      wasteType: type,
      qty: qty,
      typeTitle: '🌱 Setor Sampah ' + (type === 'PLASTIK' ? 'Plastik' : 'Minyak Jelantah'),
      desc: 'Setor ' + qty + ' ' + (priceInfo ? priceInfo.unit : '') + ' ' + type.toLowerCase() + ' @ Rp ' + (priceInfo ? priceInfo.price : 0),
      amount: totalAmount,
      walletTitle: 'Saldo Hijau',
      currBalance: currBal,
      nextBalance: nextBal
    });
  },

  prepareBelanjaSubmit: function() {
    if (this.cart.length === 0) {
      this.showToast('Keranjang belanja kosong', 'error');
      return;
    }

    const totalBelanja = this.cart.reduce((sum, item) => sum + (item.qty * item.price), 0);
    const currBal = this.currentShoppingWallet === 'HIJAU' 
      ? (this.currentMember.saldoHijau || 0) 
      : (this.currentMember.saldoTabungan || 0);

    if (currBal < totalBelanja) {
      this.showToast('Saldo ' + this.currentShoppingWallet.toLowerCase() + ' tidak cukup (Saldo: Rp ' + currBal.toLocaleString('id-ID') + ')', 'error');
      return;
    }

    const cartDetails = this.cart.map(item => item.name + ' (' + item.qty + 'x)').join(', ');
    const nextBal = currBal - totalBelanja;

    this.openConfirmModal({
      category: 'BELANJA',
      cart: this.cart,
      walletType: this.currentShoppingWallet,
      typeTitle: this.currentShoppingWallet === 'HIJAU' ? '🛒 Tukar ATK Saldo Hijau' : '🛒 Belanja Koperasi Tabungan',
      desc: cartDetails,
      amount: totalBelanja,
      walletTitle: this.currentShoppingWallet === 'HIJAU' ? 'Saldo Hijau' : 'Saldo Tabungan',
      currBalance: currBal,
      nextBalance: nextBal
    });
  },

  currentMemberRecentTx: [],

  // MINI RECENT TRANSACTIONS (KASIR)
  loadMemberRecentTransactions: function(memberId) {
    const tbody = document.getElementById('k-member-recent-tbody');
    const container = document.getElementById('k-member-recent-container');
    if (!tbody || !container) return;

    container.classList.remove('hidden');
    tbody.innerHTML = '<tr><td colspan="4" class="py-2 text-center text-slate-400">Memuat mutasi...</td></tr>';

    google.script.run
      .withSuccessHandler((res) => {
        if (!res.success || res.data.length === 0) {
          app.currentMemberRecentTx = [];
          tbody.innerHTML = '<tr><td colspan="4" class="py-2 text-center text-slate-400">Belum ada transaksi sebelumnya.</td></tr>';
          return;
        }

        app.currentMemberRecentTx = res.data;

        let html = '';
        res.data.forEach(t => {
          const dateObj = new Date(t.timestamp);
          const dateStr = dateObj.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' });
          const timeStr = dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
          const fullDateTime = dateStr + ', ' + timeStr;
          
          const isCancel = t.status === 'CANCELLED';
          const isCredit = (t.credit && t.credit > 0);
          const amountColor = isCancel ? 'text-slate-400 line-through' : (isCredit ? 'text-green-700' : 'text-rose-600');
          const amountSign = isCancel ? '' : (isCredit ? '+' : '-');

          const detailBtn = `<button type="button" onclick="app.reprintKwitansi('${t.transaction_id}')" class="inline-flex items-center justify-center gap-1 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 px-2.5 py-1 rounded-lg text-xs font-bold transition-all shadow-xs active:scale-95" title="Lihat Kwitansi / Detail Transaksi">
            <i data-lucide="receipt" class="w-3.5 h-3.5 text-blue-600"></i>
            <span>Detail</span>
          </button>`;

          let actionOrBadge = '';
          if (isCancel) {
            actionOrBadge = `<span class="inline-flex items-center justify-center gap-1 bg-rose-50 text-rose-700 border border-rose-200 px-2.5 py-1 rounded-lg text-xs font-black uppercase tracking-wider shadow-xs" title="Transaksi ini telah dibatalkan">
              <i data-lucide="ban" class="w-3.5 h-3.5 text-rose-600"></i>
              <span>Batal</span>
            </span>`;
          } else if (t.has_pending_void) {
            actionOrBadge = `<span class="inline-flex items-center justify-center gap-1 bg-amber-50 text-amber-700 border border-amber-200 px-2.5 py-1 rounded-lg text-xs font-bold shadow-xs" title="Menunggu persetujuan pembatalan dari Manager">
              <i data-lucide="clock" class="w-3.5 h-3.5 text-amber-500"></i>
              <span>Menunggu Batal</span>
            </span>`;
          } else {
            actionOrBadge = `<button type="button" onclick="app.openModalRequestVoid('${t.transaction_id}', '${encodeURIComponent(t.description || t.type)}', ${t.amount || 0})" class="inline-flex items-center justify-center gap-1 bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-700 border border-slate-200 hover:border-rose-200 px-2.5 py-1 rounded-lg text-xs font-bold transition-all shadow-xs active:scale-95" title="Ajukan Pembatalan Transaksi">
              <i data-lucide="x-circle" class="w-3.5 h-3.5 text-rose-500"></i>
              <span>Ajukan Batal</span>
            </button>`;
          }

          html += `<tr class="${isCancel ? 'bg-rose-50/25 opacity-75' : 'hover:bg-slate-50/80'} transition-colors">
            <td class="py-2.5 px-3 font-medium ${isCancel ? 'text-slate-400' : 'text-slate-600'} whitespace-nowrap">${fullDateTime}</td>
            <td class="py-2.5 px-2 font-semibold ${isCancel ? 'text-slate-400' : 'text-slate-800'}">${t.type}</td>

  submitRequestVoid: function(e) {

    const txId = document.getElementById('vr-tx-id').value;
    const reason = document.getElementById('vr-reason').value;

    this.showLoading(true);
    google.script.run
      .withSuccessHandler((res) => {

        if (res.success) {
          this.showToast(res.message, 'success');
          document.getElementById('modal-request-void').classList.add('hidden');
          this.loadKasirDashboard();

            this.loadMemberRecentTransactions(this.currentMember.member_id);

        } else {
          this.showToast(res.message, 'error');

  // VOID REVIEW (MANAGER)
  openModalVoidManager: function() {
    const modal = document.getElementById('modal-void-manager');
    if (!modal) return;
    modal.classList.remove('hidden');
    this.loadVoidRequests();
  },

  loadVoidRequests: function() {
    const tbody = document.getElementById('m-void-tbody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-slate-400 font-sans">Memuat permohonan pembatalan...</td></tr>';

    google.script.run
      .withSuccessHandler((res) => {
        if (!res.success || res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-slate-400 font-sans">Tidak ada permohonan pembatalan transaksi saat ini.</td></tr>';
          return;
        }

        let pendingCount = 0;
        let html = '';
        res.data.forEach(v => {
          if (v.status === 'PENDING') pendingCount++;
          const dateStr = new Date(v.requested_at).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
          let actionCol = '';

          if (v.status === 'PENDING') {
            actionCol = `<div class="flex gap-1 justify-center">
              <button onclick="app.approveVoid('${v.void_id}')" class="bg-green-600 hover:bg-green-700 text-white px-2 py-1 rounded-lg text-xs font-bold shadow-sm">Setujui</button>
              <button onclick="app.rejectVoid('${v.void_id}')" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded-lg text-xs font-bold shadow-sm">Tolak</button>
            </div>`;
          } else if (v.status === 'APPROVED') {
            actionCol = '<span class="text-green-700 bg-green-50 border border-green-200 px-2 py-0.5 rounded-full font-bold">Disetujui</span>';
          } else {
            actionCol = `<span class="text-red-700 bg-red-50 border border-red-200 px-2 py-0.5 rounded-full font-bold" title="${v.reject_reason}">Ditolak</span>`;
          }

          html += `<tr>
            <td class="py-3 px-3">${dateStr}</td>
            <td class="py-3 px-3 font-mono font-bold">${v.transaction_id}</td>
            <td class="py-3 px-3 font-bold text-slate-800">${v.member_name} (${v.member_kelas})</td>
            <td class="py-3 px-3 font-mono">${v.cashier_id}</td>
            <td class="py-3 px-3 text-right font-black text-slate-800">Rp ${(v.amount || 0).toLocaleString('id-ID')}</td>
            <td class="py-3 px-3 text-slate-600 text-xs">${v.reason}</td>
            <td class="py-3 px-3 text-center">${actionCol}</td>
          </tr>`;
        });

        tbody.innerHTML = html;
        const badge = document.getElementById('m-badge-pending-void');
        if (badge) badge.innerText = pendingCount;
      })
      .withFailureHandler((err) => app.handleError(err))
      .getVoidRequests(this.session.token);
  },

  approveVoid: function(voidId) {
    if (!confirm('Apakah Anda yakin ingin menyetujui pembatalan transaksi ini? Status transaksi akan menjadi CANCELLED dan saldo siswa akan disesuaikan kembali.')) return;
    this.showLoading(true);
    google.script.run
      .withSuccessHandler((res) => {
        this.showLoading(false);
        if (res.success) {
          this.showToast(res.message, 'success');
          this.loadVoidRequests();
          this.loadManagerDashboard();
        } else {
          this.showToast(res.message, 'error');
        }
      })
      .withFailureHandler((err) => app.handleError(err))
      .reviewVoidRequest(this.session.token, voidId, 'APPROVED', '');
  },

  rejectVoid: function(voidId) {
    const reason = prompt('Masukkan alasan penolakan permohonan pembatalan:');
    if (reason === null) return;
    this.showLoading(true);
    google.script.run
      .withSuccessHandler((res) => {
        this.showLoading(false);
        if (res.success) {
          this.showToast(res.message, 'success');
          this.loadVoidRequests();
        } else {
          this.showToast(res.message, 'error');
        }
      })
      .withFailureHandler((err) => app.handleError(err))
      .reviewVoidRequest(this.session.token, voidId, 'REJECTED', reason);
  },

  // APP VERSION & UPDATE CONTROL PANEL (MANAGER)
  openModalAppVersionManager: function() {
    const modal = document.getElementById('modal-app-version-manager');
    if (!modal) return;
    modal.classList.remove('hidden');
    if (typeof lucide !== 'undefined') lucide.createIcons();

  closeModalAppVersionManager: function() {
    const modal = document.getElementById('modal-app-version-manager');
    if (modal) modal.classList.add('hidden');
  },

  loadAppVersionConfig: function() {
    this.showLoading(true);
    google.script.run
      .withSuccessHandler((res) => {
        this.showLoading(false);
        if (res && res.success && res.data) {
          const d = res.data;
          const vInput = document.getElementById('ver-input-latest-version');
          const bInput = document.getElementById('ver-input-latest-build');
          const minVInput = document.getElementById('ver-input-min-version');
          const minBInput = document.getElementById('ver-input-min-build');
          const tInput = document.getElementById('ver-input-title');
          const nInput = document.getElementById('ver-input-notes');
          const uInput = document.getElementById('ver-input-url');
          const aInput = document.getElementById('ver-input-active');
          const rRequired = document.getElementById('ver-radio-required');
          const rOptional = document.getElementById('ver-radio-optional');

          if (vInput) vInput.value = d.latest_version || '1.0.0';
          if (bInput) bInput.value = d.latest_build_number || 1;
          if (minVInput) minVInput.value = d.min_required_version || '1.0.0';
          if (minBInput) minBInput.value = d.min_required_build_number || 1;
          if (tInput) tInput.value = d.update_title || 'Pembaruan SATUS Mobile Tersedia';
          if (nInput) nInput.value = d.release_notes || '';
          if (uInput) uInput.value = d.play_store_url || '';
          if (aInput) aInput.checked = (d.is_active !== false);

          if (d.is_required) {
            if (rRequired) rRequired.checked = true;
          } else {
            if (rOptional) rOptional.checked = true;
          }

          const badgeAction = document.getElementById('m-badge-version-type');
          if (badgeAction) {
            badgeAction.innerText = 'v' + (d.latest_version || '1.0.0');
          }

          const lastUpdated = document.getElementById('ver-last-updated-text');
          if (lastUpdated && d.updated_at) {
            try {
              lastUpdated.innerText = 'Terakhir disimpan: ' + new Date(d.updated_at).toLocaleString('id-ID');
            } catch(e) {}
          }

          this.updateVersionModalPreview();
        } else {
          this.showToast((res && res.message) || 'Gagal memuat konfigurasi versi', 'error');
        }
      })
      .withFailureHandler((err) => {
        this.showLoading(false);
        this.handleError(err);
      })
      .getAppVersionConfig({ platform: 'ANDROID' });
  },

  updateVersionModalPreview: function() {
    const vInput = document.getElementById('ver-input-latest-version');
    const tInput = document.getElementById('ver-input-title');
    const nInput = document.getElementById('ver-input-notes');
    const rRequired = document.getElementById('ver-radio-required');

    const prevVersion = document.getElementById('prev-version');
    const prevTitle = document.getElementById('prev-title');
    const prevNotes = document.getElementById('prev-notes');
    const prevBadge = document.getElementById('prev-badge-type');
    const prevIcon = document.getElementById('prev-icon-container');
    const prevLaterBtn = document.getElementById('prev-btn-later');

    const isReq = rRequired && rRequired.checked;
    const verText = (vInput && vInput.value.trim()) || '1.0.1';
    const titleText = (tInput && tInput.value.trim()) || 'Pembaruan SATUS Mobile Tersedia';
    const notesText = (nInput && nInput.value.trim()) || '- Peningkatan performa & perbaikan bug';

    if (prevVersion) prevVersion.innerText = 'v' + verText;
    if (prevTitle) prevTitle.innerText = titleText;
    if (prevNotes) prevNotes.innerText = notesText;

    if (prevBadge && prevIcon && prevLaterBtn) {
      if (isReq) {
        prevBadge.className = 'text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-rose-100 text-rose-800';
        prevBadge.innerText = 'Pembaruan Wajib (Required)';
        prevIcon.className = 'w-11 h-11 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-2 shadow-inner';
        prevLaterBtn.classList.add('hidden');
      } else {
        prevBadge.className = 'text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800';
        prevBadge.innerText = 'Pembaruan Opsional (Flexible)';
        prevIcon.className = 'w-11 h-11 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto mb-2 shadow-inner';
        prevLaterBtn.classList.remove('hidden');
      }
    }
    if (typeof lucide !== 'undefined') lucide.createIcons();

  saveAppVersionConfig: function() {
    if (!this.session || !this.session.token) {
      this.showToast('Sesi berakhir, silakan login kembali', 'error');
      return;
    }

    const vInput = document.getElementById('ver-input-latest-version');
    const bInput = document.getElementById('ver-input-latest-build');
    const minVInput = document.getElementById('ver-input-min-version');
    const minBInput = document.getElementById('ver-input-min-build');
    const tInput = document.getElementById('ver-input-title');
    const nInput = document.getElementById('ver-input-notes');
    const uInput = document.getElementById('ver-input-url');
    const aInput = document.getElementById('ver-input-active');
    const rRequired = document.getElementById('ver-radio-required');

    const latestVersion = (vInput && vInput.value.trim()) || '1.0.0';
    const latestBuild = parseInt(bInput && bInput.value, 10) || 1;
    const minVersion = (minVInput && minVInput.value.trim()) || '1.0.0';
    const minBuild = parseInt(minBInput && minBInput.value, 10) || 1;
    const isRequired = rRequired ? rRequired.checked : false;
    const updateTitle = (tInput && tInput.value.trim()) || 'Pembaruan SATUS Mobile Tersedia';
    const releaseNotes = (nInput && nInput.value.trim()) || '';
    const playStoreUrl = (uInput && uInput.value.trim()) || '';
    const isActive = aInput ? aInput.checked : true;

    const btn = document.getElementById('btn-save-app-version');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="inline-block animate-spin mr-1.5">&#9696;</span> Menyimpan...';
    }

    const payload = {
      platform: 'ANDROID',
      latest_version: latestVersion,
      latest_build_number: latestBuild,
      min_required_version: minVersion,
      min_required_build_number: minBuild,
      is_required: isRequired,
      update_title: updateTitle,
      release_notes: releaseNotes,
      play_store_url: playStoreUrl,
      is_active: isActive
    };

    google.script.run
      .withSuccessHandler((res) => {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i><span>Simpan Konfigurasi Versi</span>';
          if (typeof lucide !== 'undefined') lucide.createIcons();
        }
        if (res && res.success) {
          this.showToast('Konfigurasi rilis Play Store berhasil disimpan!', 'success');
          const badgeAction = document.getElementById('m-badge-version-type');
          if (badgeAction) badgeAction.innerText = 'v' + latestVersion;
          this.closeModalAppVersionManager();
        } else {
          this.showToast((res && res.message) || 'Gagal menyimpan konfigurasi', 'error');
        }
      })
      .withFailureHandler((err) => {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i><span>Simpan Konfigurasi Versi</span>';
          if (typeof lucide !== 'undefined') lucide.createIcons();
        }
        this.handleError(err);
      })
      .updateAppVersionConfig(this.session.token, payload);
  },

  // SISWA DASHBOARD FILTER
  rawSiswaTransactions: [],
  currentSiswaFilter: 'ALL',

  filterSiswaTransactions: function(filter) {
    this.currentSiswaFilter = filter;
    const btns = {
      'ALL': document.getElementById('stx-btn-all'),
      'TABUNGAN': document.getElementById('stx-btn-tabungan'),
      'HIJAU': document.getElementById('stx-btn-hijau'),
      'BELANJA': document.getElementById('stx-btn-belanja')
    };

    for (let k in btns) {
      if (btns[k]) {
        if (k === filter) {
          btns[k].className = 'px-2.5 py-1 rounded-lg bg-green-600 text-white shadow-sm';
        } else {
          btns[k].className = 'px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600';
        }
      }
    }

    this.renderSiswaTransactionList();
  },

  renderSiswaTransactionList: function() {
    const list = document.getElementById('s-tx-list');
    if (!list) return;

    let filtered = this.rawSiswaTransactions || [];
    if (this.currentSiswaFilter === 'TABUNGAN') {
      filtered = filtered.filter(t => t.wallet_type === 'TABUNGAN' || t.type === 'SETOR_TUNAI' || t.type === 'TARIK_TUNAI');
    } else if (this.currentSiswaFilter === 'HIJAU') {
      filtered = filtered.filter(t => t.wallet_type === 'HIJAU' || t.type.includes('PLASTIK') || t.type.includes('JELANTAH') || t.type.includes('BIBIT'));
    } else if (this.currentSiswaFilter === 'BELANJA') {
      filtered = filtered.filter(t => t.type.includes('BELANJA') || t.type.includes('ATK'));
    }

    const countEl = document.getElementById('s-tx-count');
    if (countEl) countEl.innerText = filtered.length + ' Mutasi';

    if (filtered.length === 0) {
      list.innerHTML = '<li class="p-4 text-center text-slate-400 font-sans">Tidak ada mutasi untuk kategori ini.</li>';
      return;
    }

    let html = '';
    filtered.forEach(t => {
      const isCredit = (t.credit && t.credit > 0);
      const isCancel = (t.status === 'CANCELLED');
      const isHijau = (t.wallet_type === 'HIJAU');
      const dateStr = new Date(t.timestamp).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
      const timeStr = new Date(t.timestamp).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

      let badgeBg = isHijau ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-green-100 text-green-800 border border-green-200';
      let badgeIcon = isHijau ? '🌱 Hijau' : '💰 Tabungan';

      let amountColor = isCancel ? 'text-slate-400 line-through' : (isCredit ? 'text-green-700' : 'text-rose-600');
      let amountSign = isCancel ? '' : (isCredit ? '+' : '-');

      html += `<li class="p-3.5 hover:bg-slate-50/80 transition flex items-center justify-between gap-3 ${isCancel ? 'opacity-60 bg-slate-50' : ''}">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-2xl flex items-center justify-center font-bold text-base shadow-sm ${isCredit ? 'bg-green-100 text-green-700' : 'bg-rose-100 text-rose-600'}">
            <i data-lucide="${isCredit ? 'arrow-down-left' : 'arrow-up-right'}" class="w-5 h-5"></i>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <span class="font-black text-slate-800 text-xs leading-tight">${t.type}</span>
              <span class="text-[10px] px-2 py-0.2 rounded-full font-bold ${badgeBg}">${badgeIcon}</span>
              ${isCancel ? '<span class="text-[10px] px-2 py-0.2 rounded-full font-bold bg-red-100 text-red-700">DIBATALKAN</span>' : ''}
            </div>
            <p class="text-[11px] text-slate-500 font-medium mt-0.5 leading-tight">${t.description || '-'}</p>
            <span class="text-[10px] text-slate-400 font-mono">${dateStr} ${timeStr}</span>
          </div>
        </div>
        <div class="text-right">
          <span class="font-black text-sm ${amountColor}">${amountSign} Rp ${(t.amount || 0).toLocaleString('id-ID')}</span>
        </div>
      </li>`;
    });

    list.innerHTML = html;
    if (typeof lucide !== 'undefined') lucide.createIcons();
  },



  // KASIR ALL-TRANSACTIONS FILTER & RENDER
  rawKasirTransactions: [],

  switchKasirTxFilter: function(mode) {
    this.currentKasirFilter = mode;
    const tabToday = document.getElementById('ktx-tab-today');
    const tabAll = document.getElementById('ktx-tab-all');
    if (tabToday && tabAll) {
      if (mode === 'TODAY') {
        tabToday.className = 'px-3 py-1.5 rounded-lg bg-white text-blue-800 shadow-sm transition';
        tabAll.className = 'px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-800 transition';
      } else {
        tabToday.className = 'px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-800 transition';
        tabAll.className = 'px-3 py-1.5 rounded-lg bg-white text-blue-800 shadow-sm transition';
      }
    }
    this.filterKasirTxList();
  },

  filterKasirTxList: function() {
    const searchInput = document.getElementById('k-tx-search');
    const q = searchInput ? searchInput.value.toLowerCase().trim() : '';
    const todayStr = new Date().toDateString();

    let filtered = this.rawKasirTransactions || [];
    if (this.currentKasirFilter === 'TODAY') {
      filtered = filtered.filter(t => new Date(t.timestamp).toDateString() === todayStr);
    }

    if (q) {
      filtered = filtered.filter(t => 
        (t.transaction_id && t.transaction_id.toLowerCase().includes(q)) ||
        (t.member_id && t.member_id.toLowerCase().includes(q)) ||
        (t.type && t.type.toLowerCase().includes(q)) ||
        (t.description && t.description.toLowerCase().includes(q))
      );
    }

    this.renderKasirTxTable(filtered);
  },

      const fullDateTime = dateStr + ' ' + timeStr;

      const isCredit = (t.credit && t.credit > 0);
      const isHijau = (t.wallet_type === 'HIJAU');
      const isCancel = (t.status === 'CANCELLED');

      const badgeClass = isHijau ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-green-50 text-green-800 border-green-200';
      const badgeIcon = isHijau ? '🌱 Hijau' : '💰 Tabungan';

      const detailBtn = `<button type="button" onclick="app.reprintKwitansi('${t.transaction_id}')" class="inline-flex items-center justify-center gap-1 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 px-2.5 py-1 rounded-lg text-xs font-bold transition-all shadow-xs active:scale-95" title="Lihat Kwitansi / Detail Transaksi">
        <i data-lucide="receipt" class="w-3.5 h-3.5 text-blue-600"></i>
        <span>Detail</span>
      </button>`;

      let actionOrBadge = '';

  setCatalogFilter: function(filter) {
    this.currentCatalogFilter = filter;
    const btns = {
      'ALL': document.getElementById('scat-btn-all'),
      'READY': document.getElementById('scat-btn-ready'),
      'EMPTY': document.getElementById('scat-btn-empty')
    };

    for (let k in btns) {

  filterCatalogProducts: function() {
    const searchInput = document.getElementById('s-catalog-search');
    const q = searchInput ? searchInput.value.toLowerCase().trim() : '';

    let filtered = this.rawCatalogProducts || [];

    if (this.currentCatalogFilter === 'READY') {
      filtered = filtered.filter(p => (parseInt(p.stock, 10) || 0) > 0);
    } else if (this.currentCatalogFilter === 'EMPTY') {
      filtered = filtered.filter(p => (parseInt(p.stock, 10) || 0) <= 0);
    }

    if (q) {
      filtered = filtered.filter(p => 
        (p.product_name && p.product_name.toLowerCase().includes(q)) ||
        (p.category && p.category.toLowerCase().includes(q)) ||
        (p.product_id && p.product_id.toLowerCase().includes(q))
      );
    }

    this.renderCatalogGrid(filtered);
  },

  session: null,

  saveSession: function(sessionData) {
    if (!sessionData) {
      sessionStorage.removeItem('satus_session');
      try {
        const localStored = JSON.parse(localStorage.getItem('satus_session') || 'null');
        if (!localStored || !this.session || localStored.userId === this.session.userId) {
          localStorage.removeItem('satus_session');
        }
      } catch(e) {
        localStorage.removeItem('satus_session');
      }
      return;
    }
    try {
      const str = JSON.stringify(sessionData);
      sessionStorage.setItem('satus_session', str);
      localStorage.setItem('satus_session', str);
    } catch (e) {
      console.error('Failed to save session:', e);
    }
  },
  
  init: function() {
    try {
      const currentYear = new Date().getFullYear();
      const fYear = document.getElementById('footer-year');
      if (fYear) fYear.innerText = currentYear;
      const lYear = document.getElementById('login-footer-year');
      if (lYear) lYear.innerText = currentYear;

      // Load session: prioritize sessionStorage for tab isolation, fallback to localStorage
      const stored = sessionStorage.getItem('satus_session') || localStorage.getItem('satus_session');
      try {
        this.session = JSON.parse(stored);
        if (this.session) {
          sessionStorage.setItem('satus_session', JSON.stringify(this.session));
        }
      } catch(e) {
        this.session = null;
      }

      this.updateNavProfile();
      this.route();

      // Background session verification and photo sync (non-blocking)
      if (this.session && this.session.token) {
        const activeToken = this.session.token;
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              if (res && res.success && res.data) {
                this.session = {
                  ...this.session,
                  ...res.data,
                  token: activeToken // Guarantee token is preserved
                };
                this.saveSession(this.session);
                this.updateNavProfile();
              }
            })
            .withFailureHandler((err) => {
              console.warn('Silent session validation check:', err);
            })
            .getCurrentSession(activeToken);
        }
      }
    } catch (initErr) {
      console.error('Fatal error during app.init():', initErr);
      try { this.renderPage('tpl-login'); } catch(e) {}
    }
  },

  showLoading: function(show) {
    const el = document.getElementById('loading');
    if (el) el.classList.toggle('hidden', !show);
  },

  showToast: function(message, type = 'info') {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = (message || '').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    container.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
  },

  route: function() {
    try {
      const navbar = document.getElementById('navbar');
      if (!this.session) {
        if (navbar) navbar.classList.add('hidden');
        this.renderPage('tpl-login');
        setTimeout(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, 50);
      } else {
        if (navbar) navbar.classList.remove('hidden');
        const userEl = document.getElementById('nav-username');
        const role = String(this.session.role || '').toUpperCase();
        if (userEl) userEl.innerText = (this.session.nama || this.session.username) + ' (' + role + ')';
        
        if (role === 'MANAGER') this.renderPage('tpl-dashboard-manager');
        else if (role === 'KASIR') this.renderPage('tpl-dashboard-kasir');
        else if (role === 'SISWA') this.renderPage('tpl-dashboard-siswa');
        else {
          this.logout();
          this.showToast('Role tidak valid', 'error');
        }
      }
    } catch (routeErr) {
      console.error('Fatal error during app.route():', routeErr);
      try { this.renderPage('tpl-login'); } catch(e) {}
    }
  },

  renderPage: function(templateId) {
    if (this.html5QrcodeScanner) {
      try {
        this.html5QrcodeScanner.clear().catch(e => console.log(e));
      } catch(e) {}
      this.html5QrcodeScanner = null;
    }
    const content = document.getElementById('app-content');
    const template = document.getElementById(templateId);
    if(template) {
      content.innerHTML = template.innerHTML;
      if (typeof lucide !== 'undefined') lucide.createIcons();
      if(templateId === 'tpl-dashboard-manager') this.loadManagerDashboard();
      if(templateId === 'tpl-dashboard-kasir') this.loadKasirDashboard();
      if(templateId === 'tpl-dashboard-siswa') this.loadSiswaDashboard();
      if(templateId === 'tpl-member-list') this.loadMemberList();
      if(templateId === 'tpl-waste-price') this.loadWastePrice();
      if(templateId === 'tpl-product-list') this.loadProductList();
      if(templateId === 'tpl-audit-log') this.loadAuditLog();
    } else {
      content.innerHTML = '<div class="text-center text-red-500 mt-10">404 - Template not found</div>';
    }
  },

  handleError: function(err) {
    this.showLoading(false);
    console.error('API Error:', err);
    if (err && err.message && (err.message.includes('Unauthorized') || err.message.includes('Session expired'))) {
      this.showToast('Sesi berakhir atau akun tidak aktif. Silakan login kembali.', 'error');
      setTimeout(() => {
        this.logout();
      }, 1000);
    } else if (err && err.message && err.message.includes('Forbidden')) {
      this.showToast('Akses ditolak: Wewenang akun tidak mencukupi untuk tindakan ini.', 'error');
    } else {
      this.showToast(err ? err.message : 'Terjadi kesalahan sistem', 'error');
    }
  },

  handleLogin: function(e) {
    e.preventDefault();
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    
    this.showLoading(true);
    google.script.run
      .withSuccessHandler((res) => {
        this.showLoading(false);
        if (res.success) {
          this.session = res.data;
          this.session.token = res.token || (res.data && res.data.token);
          this.saveSession(this.session);
          this.updateNavProfile();
          this.showToast('Login berhasil! Selamat datang, ' + res.data.nama, 'success');
          this.route();
        } else {
          this.showToast(res.message, 'error');
        }
      })
      .withFailureHandler((err) => app.handleError(err))
      .login(user, pass);
  },

    if (!modal) {
      if (confirm('Apakah Anda yakin ingin keluar dari aplikasi SATUS?')) {

  closeLogoutModal: function() {

  proceedLogout: function() {
    this.closeLogoutModal();

  },

  logout: function() {
    const currentUserId = this.session ? this.session.userId : null;
    this.session = null;
    sessionStorage.removeItem('satus_session');
    try {
      const localStored = JSON.parse(localStorage.getItem('satus_session') || 'null');
      if (!localStored || !currentUserId || localStored.userId === currentUserId) {
        localStorage.removeItem('satus_session');
      }
    } catch (e) {
      localStorage.removeItem('satus_session');
    }
    this.updateNavProfile();
    this.route();
  },

  renderImpactReport: function(d) {
    if (!d) return;

    // 1. Financial Impact
    const totalSiswa = d.totalSiswa || 0;
    const siswaAktif = d.siswaAktif || 0;
    const totalTabungan = d.totalSaldoTabungan || 0;
    const totalHijau = d.totalSaldoHijau || 0;
    const totalSaldo = (totalTabungan + totalHijau);

    if (document.getElementById('ir-siswa')) document.getElementById('ir-siswa').innerText = totalSiswa + ' Siswa';
    if (document.getElementById('ir-siswa-sub')) document.getElementById('ir-siswa-sub').innerText = siswaAktif + ' Siswa Aktif';
    if (document.getElementById('ir-tabungan')) document.getElementById('ir-tabungan').innerText = 'Rp ' + totalTabungan.toLocaleString('id-ID');
    if (document.getElementById('ir-hijau')) document.getElementById('ir-hijau').innerText = 'Rp ' + totalHijau.toLocaleString('id-ID');
    if (document.getElementById('ir-total-saldo')) document.getElementById('ir-total-saldo').innerText = 'Rp ' + totalSaldo.toLocaleString('id-ID');

    // 2. Environmental Impact
    const plastik = d.plastikTerkumpul || 0;
    const jelantah = d.jelantahTerkumpul || 0;
    const bibit = d.bibitTerkonversi || 0;

    if (document.getElementById('ir-plastik')) document.getElementById('ir-plastik').innerText = plastik + ' Kg';
    if (document.getElementById('ir-jelantah')) document.getElementById('ir-jelantah').innerText = jelantah + ' Liter';
    if (document.getElementById('ir-bibit')) document.getElementById('ir-bibit').innerText = bibit + ' Bibit Pohon';

    // 3. Economic & Circular Impact
    const ekonomi = d.nilaiEkonomiSampah || 0;
    const atk = d.atkDitukar || 0;

  copyTextToClipboard: function(text, successMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        this.showToast(successMsg, 'success');
      }).catch(() => {
        this.fallbackCopyText(text, successMsg);
      });
    } else {
      this.fallbackCopyText(text, successMsg);
    }
  },

  fallbackCopyText: function(text, successMsg) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');
      this.showToast(successMsg, 'success');
    } catch (e) {
      this.showToast('Gagal menyalin teks ke clipboard.', 'error');
    }
    document.body.removeChild(ta);
  },

          content.classList.remove('hidden');
        } else {

  loadSeedRequestsManager: function() {
    const tbody = document.getElementById('m-seed-req-tbody');

        if (!res.success) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-red-500">${res.message}</td></tr>`;
          return;
        }

        app.rawSeedRequests = res.data;
        const pendingCount = res.data.filter(r => r.status === 'PENDING').length;
        if (document.getElementById('m-tab-badge-pending')) document.getElementById('m-tab-badge-pending').innerText = pendingCount;
        if (document.getElementById('m-badge-pending-bibit')) document.getElementById('m-badge-pending-bibit').innerText = pendingCount;

        if (res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-gray-400">Belum ada pengajuan bibit dari siswa.</td></tr>';
          return;
        }

        let html = '';
        res.data.forEach(req => {
          const dateStr = new Date(req.requested_at).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
          
          let statusBadge = '';
          let actionBtns = '';

          if (req.status === 'PENDING') {
            statusBadge = '<span class="bg-yellow-100 text-yellow-800 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase"><i class="fas fa-clock mr-0.5"></i> Menunggu</span>';

                <button onclick="app.rejectBibit('${req.request_id}')" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-xs font-bold shadow-sm" title="Tolak Pengajuan"><i class="fas fa-times"></i> Tolak</button>
              </div>`;
          } else if (req.status === 'APPROVED') {
            statusBadge = '<span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase"><i class="fas fa-thumbs-up mr-0.5"></i> Disetujui</span>';
            actionBtns = `<button onclick="app.fulfillBibit('${req.request_id}')" class="bg-purple-600 hover:bg-purple-700 text-white px-2.5 py-1 rounded text-xs font-bold shadow-sm"><i class="fas fa-hand-holding-heart mr-0.5"></i> Serahkan Bibit</button>`;
          } else if (req.status === 'FULFILLED') {
            statusBadge = '<span class="bg-green-100 text-green-800 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase"><i class="fas fa-check-circle mr-0.5"></i> Terealisasi</span>';
            actionBtns = '<span class="text-[11px] text-gray-400 italic">Selesai</span>';
          } else if (req.status === 'REJECTED') {
            statusBadge = `<span class="bg-red-100 text-red-800 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase" title="${req.reject_reason || ''}"><i class="fas fa-times-circle mr-0.5"></i> Ditolak</span>`;
            actionBtns = `<span class="text-[11px] text-red-400" title="${req.reject_reason || ''}">Ditolak</span>`;
          }

          html += `<tr>
            <td class="p-3 border-b text-gray-500">${dateStr}</td>
            <td class="p-3 border-b">
              <div class="font-bold text-gray-800">${req.member_name}</div>

            <td class="p-3 border-b text-right">${actionBtns}</td>

      })
      .withFailureHandler((err) => app.handleError(err))
      .getSeedRequests(this.session.token);

  showKwitansi: function(txData) {
    this.lastKwitansiData = txData;

    const txId = txData.transactionId || txData.transaction_id || '-';
    const type = txData.type || '-';
    const wallet = txData.walletType || txData.wallet_type || 'TABUNGAN';
    const member = txData.memberId || txData.member_id || '-';
    const desc = txData.desc || txData.description || txData.type || '-';
    const amount = Number(txData.amount || 0);

    const kwIdEl = document.getElementById('kw-id');
    if (kwIdEl) kwIdEl.innerText = txId;
    const kwTypeEl = document.getElementById('kw-type');
    if (kwTypeEl) kwTypeEl.innerText = type;
    const kwWalletEl = document.getElementById('kw-wallet');
    if (kwWalletEl) kwWalletEl.innerText = wallet;
    const kwMemberEl = document.getElementById('kw-member');
    if (kwMemberEl) kwMemberEl.innerText = member;
    const kwDescEl = document.getElementById('kw-desc');
    if (kwDescEl) kwDescEl.innerText = desc;
    const kwTotalEl = document.getElementById('kw-total');
    if (kwTotalEl) kwTotalEl.innerText = 'Rp ' + amount.toLocaleString('id-ID');

    // Handle Title, Icon & Status Badge for Cancelled vs Reprint vs Success
    const iconContainer = document.getElementById('kw-icon-container');
    const iconEl = document.getElementById('kw-icon');
    const titleEl = document.getElementById('kw-title');
    const badgeEl = document.getElementById('kw-status-badge');

    const isCancel = (txData.status === 'CANCELLED');
    const isReprint = !!txData.isReprint;

    if (isCancel) {
      if (iconContainer) iconContainer.className = 'w-14 h-14 bg-rose-100 rounded-2xl flex items-center justify-center mx-auto mb-3 text-rose-600 text-2xl shadow-inner transition-colors';
      if (iconEl) iconEl.setAttribute('data-lucide', 'x-circle');
      if (titleEl) titleEl.innerText = 'Transaksi Dibatalkan';
      if (badgeEl) {
        badgeEl.className = 'my-1.5';
        badgeEl.innerHTML = '<span class="bg-rose-100 text-rose-800 border border-rose-300 px-3 py-1 rounded-full font-black text-[11px] uppercase tracking-wider">⚠️ DIBATALKAN (BATAL)</span>';
      }
    } else if (isReprint) {
      if (iconContainer) iconContainer.className = 'w-14 h-14 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-3 text-blue-600 text-2xl shadow-inner transition-colors';
      if (iconEl) iconEl.setAttribute('data-lucide', 'receipt');
      if (titleEl) titleEl.innerText = 'Bukti Kwitansi Transaksi';
      if (badgeEl) {
        badgeEl.className = 'my-1.5';
        badgeEl.innerHTML = '<span class="bg-blue-50 text-blue-700 border border-blue-200 px-2.5 py-0.5 rounded-full font-bold text-[10px]">SALINAN STRUK RESMI</span>';
      }
    } else {
      if (iconContainer) iconContainer.className = 'w-14 h-14 bg-green-100 rounded-2xl flex items-center justify-center mx-auto mb-3 text-green-600 text-2xl shadow-inner transition-colors';
      if (iconEl) iconEl.setAttribute('data-lucide', 'check-circle-2');
      if (titleEl) titleEl.innerText = 'Transaksi Berhasil!';
      if (badgeEl) {
        badgeEl.className = 'hidden my-1.5';
        badgeEl.innerHTML = '';
      }
    }

    const saldoRow = document.getElementById('kw-saldo-row');
    const saldoEl = document.getElementById('kw-saldo');
    if (txData.dualBalance) {
      if (saldoRow) saldoRow.classList.remove('hidden');
      if (saldoEl) saldoEl.innerText = `Tabungan: Rp ${(txData.dualBalance.tabungan || 0).toLocaleString('id-ID')} | Hijau: Rp ${(txData.dualBalance.hijau || 0).toLocaleString('id-ID')}`;
      if (document.getElementById('k-m-saldo-tabungan')) document.getElementById('k-m-saldo-tabungan').innerText = 'Rp ' + (txData.dualBalance.tabungan || 0).toLocaleString('id-ID');
      if (document.getElementById('k-m-saldo-hijau')) document.getElementById('k-m-saldo-hijau').innerText = 'Rp ' + (txData.dualBalance.hijau || 0).toLocaleString('id-ID');
    } else if (txData.newBalance !== undefined && txData.newBalance !== null) {
      if (saldoRow) saldoRow.classList.remove('hidden');
      if (saldoEl) saldoEl.innerText = 'Rp ' + Number(txData.newBalance).toLocaleString('id-ID');
    } else {
      if (saldoRow) saldoRow.classList.remove('hidden');
      if (saldoEl) saldoEl.innerText = isCancel ? 'Dibatalkan (Saldo Dipulihkan)' : 'Tercatat di Sistem';
    }

    const modal = document.getElementById('modal-kwitansi');
    if (modal) modal.classList.remove('hidden');
    if (typeof lucide !== 'undefined') lucide.createIcons();
  },

  reprintKwitansi: function(txId) {
    if (!txId) return;

    // 1. Search in local rawKasirTransactions cache
    let tx = (this.rawKasirTransactions || []).find(t => t.transaction_id === txId);

    // 2. Search in currentMemberRecentTx cache
    if (!tx && this.currentMemberRecentTx) {
      tx = this.currentMemberRecentTx.find(t => t.transaction_id === txId);
    }

    if (tx) {
      let memberDisplay = tx.member_id;
      if (this.currentMember && this.currentMember.member_id === tx.member_id) {
        memberDisplay = `${this.currentMember.nama} (${tx.member_id})`;
      } else if (this.rawMembers) {
        const m = this.rawMembers.find(mem => mem.member_id === tx.member_id);
        if (m) memberDisplay = `${m.nama} (${tx.member_id})`;
      }

      // CRITICAL: Call showKwitansi ONCE and return immediately!
      // NO background calls that would reopen the modal later!
      this.showKwitansi({
        transactionId: tx.transaction_id,
        type: tx.type,
        walletType: tx.wallet_type || 'TABUNGAN',
        memberId: memberDisplay,
        desc: tx.description || tx.type,
        amount: tx.amount,
        status: tx.status,
        timestamp: tx.timestamp,
        isReprint: true
      });
      return;
    }

    // 3. Fallback: only if not found in any cache, fetch once from server
    this.showLoading(true);
    google.script.run
      .withSuccessHandler((res) => {
        this.showLoading(false);
        if (res && res.success && res.data) {
          const d = res.data;
          this.showKwitansi({
            transactionId: d.transaction_id,
            type: d.type,
            walletType: d.wallet_type || 'TABUNGAN',
            memberId: d.member_name ? `${d.member_name} (${d.member_id})` : d.member_id,
            desc: d.description || d.type,
            amount: d.amount,
            status: d.status,
            timestamp: d.timestamp,
            isReprint: true
          });
        } else {
          this.showToast((res && res.message) || 'Gagal memuat detail transaksi', 'error');
        }
      })
      .withFailureHandler((err) => {
        this.showLoading(false);
        app.handleError(err);
      })
      .getTransactionDetail(this.session.token, txId);
  },

  loadKasirDashboard: function() {

        if (res.success) {

          app.rawKasirTransactions = allTx;
          
          const todayStr = new Date().toDateString();

  addCartItem: function() {
    const prodId = document.getElementById('b-product-select').value;
    const qty = parseInt(document.getElementById('b-qty').value, 10);
    if(!prodId || qty < 1) return;
    
    const prod = app.products.find(p => p.product_id === prodId);
    if(!prod) return;
    
    if(qty > prod.stock) {
      this.showToast(`Stok ${prod.product_name} hanya tersisa ${prod.stock}`, 'error');
      return;
    }

    const itemPrice = app.currentShoppingWallet === 'HIJAU' 
      ? (parseFloat(prod.green_price) || parseFloat(prod.price) || 0)
      : (parseFloat(prod.price) || 0);
    
    app.cart.push({
      productId: prodId,
      name: prod.product_name,
      qty: qty,
      price: itemPrice
    });
    
    app.renderCart();
  },
  
  clearCart: function() {
    app.cart = [];
    app.renderCart();
  },

  renderCart: function() {
    const list = document.getElementById('b-cart-list');
    let html = '';
    let total = 0;
    app.cart.forEach((item, index) => {
      const subtotal = item.qty * item.price;
      total += subtotal;
      html += `<li class="flex justify-between items-center border-b border-gray-200 pb-1 text-xs">
        <span>${item.qty}x ${item.name}</span>
        <span class="flex items-center space-x-2">
          <span class="font-bold">Rp ${subtotal.toLocaleString('id-ID')}</span>
          <button type="button" onclick="app.cart.splice(${index}, 1); app.renderCart();" class="text-red-500 font-bold hover:text-red-700">&times;</button>
        </span>
      </li>`;
    });
    list.innerHTML = html;
    document.getElementById('b-total').innerText = 'Rp ' + total.toLocaleString('id-ID');
  },

          document.getElementById('s-info').innerText = `ID: ${pId} | NIS: ${pNis} | Kelas: ${pKelas}`;
          
          // Dual Balance display (PRD v2 Poin 30)

          document.getElementById('s-saldo-hijau').innerText = 'Rp ' + (d.saldoHijau || 0).toLocaleString('id-ID');

            document.getElementById('s-target-bar').style.width = `${pct}%`;
          } else {
            document.getElementById('s-target-name').innerText = 'Belum ada target';
            document.getElementById('s-target-progress-text').innerText = 'Rp 0 / Rp 0';
            document.getElementById('s-target-percent').innerText = '0%';
            document.getElementById('s-target-bar').style.width = '0%';

          // Transactions list
          this.showLoading(false);
          const list = document.getElementById('s-tx-list');

          if(!d.recentTx || d.recentTx.length === 0) {
            list.innerHTML = '<li class="text-center text-gray-400 py-10">Belum ada riwayat transaksi.</li>';
            return;
          }
          
          let html = '';
          d.recentTx.forEach(tx => {
            const dateStr = new Date(tx.timestamp).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            const isIncome = tx.type.startsWith('SETOR');
            const isHijau = tx.wallet_type === 'HIJAU' || tx.type.includes('PLASTIK') || tx.type.includes('JELANTAH') || tx.type.includes('HIJAU') || tx.type.includes('BIBIT');
            
            const walletTag = isHijau 
              ? '<span class="bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2 py-0.5 rounded-full">🌱 HIJAU</span>'
              : '<span class="bg-green-100 text-green-800 text-[10px] font-extrabold px-2 py-0.5 rounded-full">💰 TABUNGAN</span>';

            const icon = isIncome 
              ? `<div class="w-9 h-9 rounded-xl ${isHijau ? 'bg-emerald-100 text-emerald-700' : 'bg-green-100 text-green-700'} flex items-center justify-center font-bold text-sm"><i class="fas fa-arrow-down"></i></div>`
              : '<div class="w-9 h-9 rounded-xl bg-red-100 text-red-600 flex items-center justify-center font-bold text-sm"><i class="fas fa-arrow-up"></i></div>';
            
            const sign = isIncome ? '+' : '-';
            const color = isIncome ? 'text-green-700' : 'text-red-600';
            
            html += `<li class="flex items-center justify-between p-3.5 border rounded-2xl hover:bg-gray-50 transition border-gray-100 bg-white">
              <div class="flex items-center space-x-3">
                ${icon}
                <div>
                  <div class="flex items-center space-x-2">
                    <p class="font-bold text-gray-800 text-xs sm:text-sm">${(tx.type || '').replace(/_/g, ' ')}</p>
                    ${walletTag}
                  </div>
                  <p class="text-[11px] text-gray-400 mt-0.5">${dateStr} &bull; ${tx.description || tx.transaction_id}</p>
                </div>
              </div>
              <div class="font-black text-sm ${color} text-right">
                ${sign} Rp ${(tx.amount || 0).toLocaleString('id-ID')}
              </div>
            </li>`;
          });
          list.innerHTML = html;
            
        } else {
          this.showLoading(false);
          this.showToast(res.message, 'error');
          if (app.session) {
            document.getElementById('s-nama').innerText = app.session.nama || app.session.username || 'Siswa';
            document.getElementById('s-info').innerText = `ID: ${app.session.userId || '--'} | Status: Aktif`;

      })
      .withFailureHandler((err) => {
        app.handleError(err);
        if (app.session) {
          document.getElementById('s-nama').innerText = app.session.nama || app.session.username || 'Siswa';
          document.getElementById('s-info').innerText = `ID: ${app.session.userId || '--'} | Status: Aktif`;

      .getDashboardData(this.session.token);
  },

    const qrData = app.myMemberData.member_id;

    const select = document.getElementById('tb-seed-select');

  calcBibitConversion: function() {
    const select = document.getElementById('tb-seed-select');
    const qtyInput = document.getElementById('tb-seed-qty');
    const qty = parseInt(qtyInput.value, 10) || 0;
    
    const opt = select.options[select.selectedIndex];
    const unitVal = opt ? parseFloat(opt.getAttribute('data-val') || 10000) : 10000;
    const totalVal = qty * unitVal;
    const currentHijau = app.siswaDualBalance.hijau || 0;
    const sisa = currentHijau - totalVal;

    document.getElementById('tb-val-unit').innerText = `Rp ${unitVal.toLocaleString('id-ID')} / bibit`;
    document.getElementById('tb-val-total').innerText = `Rp ${totalVal.toLocaleString('id-ID')}`;
    
    const sisaEl = document.getElementById('tb-val-sisa');
    sisaEl.innerText = `Rp ${Math.max(0, sisa).toLocaleString('id-ID')}`;
    if (sisa < 0) {
      sisaEl.className = 'font-bold text-red-600';
      sisaEl.innerText = `Kurang Rp ${Math.abs(sisa).toLocaleString('id-ID')} (Saldo tidak cukup)`;
    } else {
      sisaEl.className = 'font-bold text-emerald-700';
    }
  },

  setMaxBibitQty: function() {
    const select = document.getElementById('tb-seed-select');
    const opt = select.options[select.selectedIndex];
    const unitVal = opt ? parseFloat(opt.getAttribute('data-val') || 10000) : 10000;
    const currentHijau = app.siswaDualBalance.hijau || 0;
    const max = Math.floor(currentHijau / unitVal);
    document.getElementById('tb-seed-qty').value = Math.max(1, max);
    app.calcBibitConversion();
  },

  loadMemberList: function() {
    this.showLoading(true);
    google.script.run
      .withSuccessHandler((res) => {
        const tbody = document.getElementById('m-member-table-body');
        const countEl = document.getElementById('m-member-count');
        if (!res.success) {
          tbody.innerHTML = `<tr><td colspan="7" class="py-4 text-center text-red-500">${res.message}</td></tr>`;
          if (countEl) countEl.innerText = '0 Siswa';
          return;
        }

        // Layer pertahanan frontend: isolasi dev accounts dari tabel Data Anggota Siswa
        if (res.data && Array.isArray(res.data)) {
          res.data = res.data.filter(m => {
            if (!m) return false;
            const mid = String(m.member_id || '').toLowerCase();
            const uid = String(m.user_id || '').toLowerCase();
            const nama = String(m.nama || '').toLowerCase();
            const nis = String(m.nis || '').toLowerCase();
            const kelas = String(m.kelas || '').toLowerCase();
            if (mid.startsWith('dev') || uid.startsWith('dev') || mid.includes('dev-') || uid.includes('dev-')) return false;
            if (mid === 'siswa-dev' || uid === 'siswa-dev') return false;
            if (nama.includes('siswa dev') || nama.includes('siswa-dev') || nama.includes('admin dev') || nama.includes('kasir dev') || nama.includes('(testing)')) return false;
            if (nis === 'dev-001' || nis === 'dev' || nis.startsWith('dev') || kelas === 'dev') return false;
            return true;
          });
        }

        if (countEl) countEl.innerText = `Total: ${res.data.length} Siswa`;
        if (res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="py-4 text-center text-gray-500">Belum ada siswa yang terdaftar.</td></tr>';
          return;

            <td class="py-3 px-3.5 border-b font-mono font-bold text-slate-800">${m.member_id}</td>
            <td class="py-3 px-3.5 border-b font-bold text-slate-800">${m.nama}</td>

      .withSuccessHandler((res) => {

  updateUnitLabel: function() {
    const type = document.getElementById('wp-type').value;

  loadWastePrice: function() {
    this.showLoading(true);
    google.script.run
      .withSuccessHandler((res) => {
        this.showLoading(false);
        const tbody = document.getElementById('m-waste-price-body');
        if (!res.success) {
          tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-red-500">${res.message}</td></tr>`;
          return;
        }
        if (res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="py-4 text-center text-gray-500">Belum ada histori harga.</td></tr>';
          return;
        }
        
        app.rawWastePrices = res.data;
        let html = '';
        const sorted = res.data.sort((a,b) => new Date(b.effective_date) - new Date(a.effective_date));
        sorted.forEach(p => {
          const dateStr = new Date(p.effective_date).toLocaleString('id-ID');
          const rowDateIso = new Date(p.effective_date).toISOString();
          const statusCls = p.status === 'AKTIF' ? 'text-green-600 font-bold' : 'text-gray-400';
          html += `<tr>
            <td class="py-2.5 px-4 border-b">${dateStr}</td>
            <td class="py-2.5 px-4 border-b font-bold">${p.waste_type}</td>
            <td class="py-2.5 px-4 border-b font-black text-gray-800">Rp ${(p.price || 0).toLocaleString('id-ID')} / ${p.unit}</td>
            <td class="py-2.5 px-4 border-b ${statusCls}">${p.status}</td>
            <td class="py-2.5 px-4 border-b">
              <button onclick="app.openEditWastePrice('${rowDateIso}')" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs hover:bg-yellow-600">Edit</button>
            </td>
          </tr>`;
        });
        tbody.innerHTML = html;
      })
      .withFailureHandler((err) => app.handleError(err))
      .getAllWastePrices(this.session.token);
  },

  openEditWastePrice: function(dateStr) {

  // AUDIT LOGS

  loadAuditLog: function() {
    this.showLoading(true);
    google.script.run
      .withSuccessHandler((res) => {
        this.showLoading(false);
        const tbody = document.getElementById('m-audit-table-body');
        if (!res.success) {
          tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-red-500">${res.message}</td></tr>`;
          return;
        }
        if (res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="py-4 text-center text-gray-500">Belum ada log aktifitas.</td></tr>';
          return;
        }
        let html = '';
        res.data.forEach(log => {
          const dateStr = new Date(log.timestamp).toLocaleString('id-ID');
          html += `<tr class="audit-row">
            <td class="py-2.5 px-3 border-b">${dateStr}</td>
            <td class="py-2.5 px-3 border-b font-mono font-bold">${log.user_id}</td>
            <td class="py-2.5 px-3 border-b"><span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded text-xs font-bold">${log.role}</span></td>
            <td class="py-2.5 px-3 border-b font-bold text-gray-800">${log.action}</td>
            <td class="py-2.5 px-3 border-b font-mono text-xs">${log.reference_id}</td>
            <td class="py-2.5 px-3 border-b text-xs text-gray-600">${log.description}</td>
          </tr>`;
        });
        tbody.innerHTML = html;
      })
      .withFailureHandler((err) => app.handleError(err))
      .getAuditLogs(this.session.token);
  },
  
  filterAuditLog: function() {
    const input = document.getElementById('audit-search');
    const filter = input.value.toLowerCase();
    const tbody = document.getElementById('m-audit-table-body');
    const rows = tbody.getElementsByClassName('audit-row');

    for (let i = 0; i < rows.length; i++) {
      const textContent = rows[i].textContent || rows[i].innerText;
      if (textContent.toLowerCase().indexOf(filter) > -1) {
        rows[i].style.display = '';
      } else {
        rows[i].style.display = 'none';
      }
    }
  }
};

// Initialize app when DOM is ready (defensive multi-lifecycle)
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  setTimeout(() => { app.init(); }, 1);
} else {
  document.addEventListener('DOMContentLoaded', () => {
    app.init();
  });
}
